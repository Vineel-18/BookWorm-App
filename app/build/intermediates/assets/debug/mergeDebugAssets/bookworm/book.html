<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="theme-color" content="#0a0a0a"/>
  <title>Book Detail – Book Worm</title>
  <link rel="manifest" href="manifest.json"/>
  <link rel="stylesheet" href="style.css"/>
  <style>
    /* Extra bottom padding so content clears both sticky footer + bottom nav */
    .detail-page { padding-bottom: calc(var(--bottom-h) + 70px + var(--safe-bottom)); }
    /* Star buttons — large tap targets */
    .star-btn {
      background: none; border: none; font-size: 26px;
      cursor: pointer; color: #444; padding: 2px 4px;
      -webkit-tap-highlight-color: transparent;
    }
    .star-btn.lit { color: #f1c40f; }
    /* Detail cover uses same 3-zone style as card covers */
    .detail-cover-box {
      display: flex; flex-direction: column;
      justify-content: space-between;
      padding: 16px 14px;
    }
    .detail-cover-genre {
      font-size: 10px; font-weight: 600;
      color: rgba(255,255,255,0.75);
      text-transform: uppercase; letter-spacing: 1.2px;
    }
    .detail-cover-main-title {
      flex: 1; display: flex; align-items: center; justify-content: center;
      font-size: 20px; font-weight: 900; color: #fff;
      text-transform: uppercase; text-align: center;
      letter-spacing: .5px; line-height: 1.25;
      word-break: break-word;
    }
    .detail-cover-author-name {
      font-size: 10px; font-weight: 600;
      color: rgba(255,255,255,0.75);
      text-transform: uppercase; letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <!-- TOP NAVBAR -->
  <nav class="navbar">
    <div class="nav-brand-wrap">
      <button class="nav-icon-btn" onclick="history.back()" style="font-size:20px;padding:6px 4px">‹</button>
      <span class="nav-brand" onclick="window.location.href='index.html'">Book Worm</span>
    </div>
    <div class="nav-spacer"></div>
    <div class="nav-right-icons">
      <a href="cart.html" class="nav-icon-btn" title="Cart">
        🛒<span class="nav-badge" id="cartBadge" style="display:none">0</span>
      </a>
      <div class="user-dd-wrap">
        <button class="nav-profile-btn" onclick="toggleDD()" title="Profile">
          <span class="nav-avatar" id="navAvatar">U</span>
        </button>
        <div class="user-dd-menu" id="userMenu">
          <div class="user-dd-profile">
            <div class="udp-avatar" id="udpAvatar">U</div>
            <div class="udp-info">
              <div class="udp-name" id="uName">User</div>
              <div class="udp-email" id="uEmail"></div>
              <div id="udpPremBadge" style="display:none"></div>
            </div>
          </div>
          <div class="user-dd-links">
            <a href="orders.html">📦 My Orders</a>
            <a href="wishlist.html">🤍 Wishlist</a>
            <a href="premium.html">👑 Premium</a>
            <a href="#" class="ud-signout" onclick="doLogout()">⎋ Sign Out</a>
          </div>
        </div>
      </div>
    </div>
  </nav>

  <!-- PAGE BODY -->
  <div class="page-body detail-page" id="detailBody">
    <!-- Rendered by JS -->
  </div>

  <!-- STICKY ADD-TO-CART FOOTER — sits above bottom nav -->
  <div class="detail-sticky-footer" id="detailFooter" style="display:none">
    <button class="btn-add-cart" id="btnAddCart">🛒 Add to Cart</button>
    <button class="btn-wishlist" id="btnWishlist">🤍</button>
  </div>

  <!-- BOTTOM NAVIGATION -->
  <nav class="bottom-nav">
    <a href="index.html"    class="bn-tab"><span class="bn-icon">🏠</span><span class="bn-label">Home</span></a>
    <a href="orders.html"   class="bn-tab"><span class="bn-icon">📦</span><span class="bn-label">Orders</span></a>
    <a href="wishlist.html" class="bn-tab"><span class="bn-icon">🤍</span><span class="bn-label">Wishlist</span></a>
    <a href="cart.html"     class="bn-tab"><span class="bn-icon">🛒</span><span class="bn-label">Cart</span></a>
    <a href="premium.html"  class="bn-tab" id="premTab"><span class="bn-icon">👑</span><span class="bn-label">Premium</span></a>
  </nav>

  <div id="toast"></div>

  <script src="data.js"></script>
  <script src="app.js"></script>
  <script>
    requireAuth();
    initNavbar();

    const params = new URLSearchParams(window.location.search);
    const bookId = parseInt(params.get('id'));
    const book   = getAllBooks().find(b => b.id === bookId);

    if (!book) { window.location.href = 'index.html'; }
    else        { renderDetail(book); renderRelated(book); }

    /* ── helpers defined BEFORE renderDetail calls them ── */

    function starStr(n) {
      n = Math.min(5, Math.max(0, Math.round(n)));
      return '★'.repeat(n) + '☆'.repeat(5 - n);
    }

    let selectedStars = 5;

    function setStars(n) {
      selectedStars = n;
      // scope to #starRow so we never accidentally grab stale/duplicate nodes
      const btns = document.querySelectorAll('#starRow .star-btn');
      btns.forEach((s, i) => s.classList.toggle('lit', i < n));
    }

    function updateCharCount() {
      const t = document.getElementById('reviewText');
      if (t) document.getElementById('charCount').textContent = t.value.length + '/500';
    }

    function renderReviews(id) {
      const stored = JSON.parse(localStorage.getItem('bw_rev_' + id) || '[]');
      const all = [
        { user: 'John Smith', text: 'A wonderful read — highly recommended for anyone looking for fresh perspective and growth.', rating: 5 },
        ...stored
      ];
      const el = document.getElementById('reviewsList');
      if (!el) return;
      el.innerHTML = all.map(r => `
        <div class="review-card">
          <div class="review-header">
            <span class="review-user">${r.user}</span>
            <span class="review-stars">${starStr(r.rating)}</span>
          </div>
          <div class="review-text">${r.text}</div>
        </div>`).join('');
    }

    function submitReview(id) {
      const textEl = document.getElementById('reviewText');
      const text   = textEl ? textEl.value.trim() : '';
      if (!text) { showToast('Please write a review first'); return; }
      const user   = getUser();
      const stored = JSON.parse(localStorage.getItem('bw_rev_' + id) || '[]');
      stored.push({ user: user?.name || 'Anonymous', text, rating: selectedStars });
      localStorage.setItem('bw_rev_' + id, JSON.stringify(stored));
      textEl.value = '';
      document.getElementById('charCount').textContent = '0/500';
      setStars(5);
      renderReviews(id);
      showToast('Review submitted ✓');
    }

    function toggleWishlist(id) {
      let wl = JSON.parse(localStorage.getItem('bw_wl') || '[]');
      const idx = wl.indexOf(id);
      const btn = document.getElementById('btnWishlist');
      if (idx > -1) {
        wl.splice(idx, 1);
        if (btn) { btn.innerHTML = '🤍'; btn.classList.remove('active'); }
        showToast('Removed from wishlist');
      } else {
        wl.push(id);
        if (btn) { btn.innerHTML = '❤️'; btn.classList.add('active'); }
        showToast('Added to wishlist ✓');
      }
      localStorage.setItem('bw_wl', JSON.stringify(wl));
    }

    /* ── main render ── */

    function renderDetail(b) {
      document.title = b.title + ' – Book Worm';
      const wl    = JSON.parse(localStorage.getItem('bw_wl') || '[]');
      const inWL  = wl.includes(b.id);
      const stars = starStr(b.rating);

      document.getElementById('detailBody').innerHTML = `
        <!-- Breadcrumb -->
        <div class="breadcrumb">
          <a href="index.html">Home</a><span>/</span>
          <a href="index.html">${b.category}</a><span>/</span>
          <span style="color:#888">${b.title}</span>
        </div>

        <!-- Cover — same 3-zone style as card -->
        <div class="detail-cover-full">
          <div class="detail-cover-box" style="background:${b.coverBg}">
            <div class="detail-cover-genre">${b.category}</div>
            <div class="detail-cover-main-title">${b.title}</div>
            <div class="detail-cover-author-name">${b.author}</div>
          </div>
        </div>

        <!-- Info -->
        <div class="detail-info">
          <div class="detail-title">${b.title}</div>
          <div class="detail-author">by <a href="#">${b.author}</a></div>
          <div class="detail-tagline">${b.desc}</div>
          <div class="detail-publisher">Sold by: <a href="stores.html">${b.publisher || 'Book Worm Store'}</a></div>
          <div class="detail-format-line">${b.format}</div>
          <div class="detail-genres-line">${b.genres.map(g => `<a href="index.html">${g}</a>`).join(', ')}</div>
          <div class="detail-price">₹${b.price}</div>
          <div class="detail-delivery">Delivery by <strong>${b.delivery}</strong></div>
        </div>

        <!-- Meta row -->
        <div class="detail-meta-row">
          <div class="meta-item">
            <span class="meta-label">Language</span>
            <span class="meta-val" style="color:var(--orange)">${b.language}</span>
          </div>
          <div class="meta-item">
            <span class="meta-label">Rating</span>
            <span class="meta-stars">${stars}</span>
          </div>
          <div class="meta-item">
            <span class="meta-label">Sold</span>
            <span class="meta-val">${b.sales.toLocaleString()} copies</span>
          </div>
        </div>

        <!-- About writer -->
        <div class="about-section">
          <h3>About the writer</h3>
          <div class="writer-row">
            <div class="writer-avatar">${b.author.charAt(0)}</div>
            <div class="writer-text">
              <div class="writer-name">${b.author}</div>
              <div class="writer-bio">
                ${b.author} is an acclaimed author and storyteller. With a passion for
                transforming lives, they have dedicated their career to helping readers reach
                their fullest potential. They are the author of <em>${b.title}</em>.
              </div>
            </div>
          </div>
        </div>

        <!-- Reviews -->
        <div class="reviews-section">
          <h3>Reviews</h3>
          <div class="review-char-label">
            <span>Leave Your Review</span>
            <span id="charCount">0/500</span>
          </div>
          <div class="review-form">
            <textarea id="reviewText" placeholder="Write your review here…"
              oninput="updateCharCount()" maxlength="500"></textarea>
            <div class="star-submit-row">
              <div id="starRow">
                <button class="star-btn" onclick="setStars(1)">★</button>
                <button class="star-btn" onclick="setStars(2)">★</button>
                <button class="star-btn" onclick="setStars(3)">★</button>
                <button class="star-btn" onclick="setStars(4)">★</button>
                <button class="star-btn" onclick="setStars(5)">★</button>
              </div>
              <button class="review-submit" onclick="submitReview(${b.id})">Submit →</button>
            </div>
          </div>
          <div id="reviewsList"></div>
        </div>

        <!-- Related reads -->
        <div class="related-section">
          <h3>Related Reads</h3>
          <div id="relatedList"></div>
        </div>`;

      /* Wire up sticky footer */
      const footer = document.getElementById('detailFooter');
      footer.style.display = 'flex';
      document.getElementById('btnAddCart').onclick = () => addToCart(b.id);
      const wlBtn = document.getElementById('btnWishlist');
      wlBtn.innerHTML = inWL ? '❤️' : '🤍';
      wlBtn.classList.toggle('active', inWL);
      wlBtn.onclick = () => toggleWishlist(b.id);

      /* Initialise stars AFTER innerHTML is set */
      renderReviews(b.id);
      // Use requestAnimationFrame to ensure DOM paint cycle has committed the innerHTML
      requestAnimationFrame(() => setStars(5));
    }

    function renderRelated(b) {
      const books = getAllBooks();
      const same  = books.filter(r => r.id !== b.id &&
        (r.category === b.category || r.genres.some(g => b.genres.includes(g))));
      const rest  = books.filter(r => r.id !== b.id && !same.find(x => x.id === r.id));
      const all   = [...same, ...rest].slice(0, 6);
      const el   = document.getElementById('relatedList');
      if (!el) return;
      el.innerHTML = all.map(r => `
        <div class="related-card" onclick="window.location.href='book.html?id=${r.id}'">
          <div class="related-cover" style="background:${r.coverBg};display:flex;flex-direction:column;justify-content:space-between;padding:6px 8px">
            <span style="font-size:6px;font-weight:700;color:rgba(255,255,255,.7);text-transform:uppercase;letter-spacing:.8px">${r.category}</span>
            <span style="font-size:9px;font-weight:900;color:#fff;text-transform:uppercase;text-align:center;line-height:1.2;flex:1;display:flex;align-items:center;justify-content:center">${r.title}</span>
            <span style="font-size:5.5px;font-weight:700;color:rgba(255,255,255,.7);text-transform:uppercase;letter-spacing:.6px">${r.author}</span>
          </div>
          <div class="related-meta">
            <div class="related-title">${r.title}</div>
            <div class="related-author" style="color:var(--orange);font-size:11.5px">by ${r.author}</div>
            <div class="related-desc">${r.desc}</div>
            <div class="related-price">₹${r.price}</div>
          </div>
        </div>`).join('');
    }
  </script>
</body>
</html>
