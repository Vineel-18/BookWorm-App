<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="theme-color" content="#0a0a0a"/>
  <title>Book Worm – Admin</title>
  <link rel="stylesheet" href="style.css"/>
  <style>
    /* Admin-specific overrides on top of style.css */
    .adm-role-badge {
      background: rgba(231,76,60,.15); color: #e74c3c;
      border: 1px solid rgba(231,76,60,.3);
      font-size: 10px; font-weight: 700; padding: 3px 9px; border-radius: 20px;
    }
    /* Stat grid */
    .stat-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 18px; }
    .stat-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 14px 12px;
    }
    .stat-icon { font-size: 20px; margin-bottom: 6px; }
    .stat-val  { font-size: 22px; font-weight: 900; color: #fff; line-height: 1; }
    .stat-lbl  { font-size: 9px; color: #555; margin-top: 3px; text-transform: uppercase; letter-spacing: .7px; }

    /* Section title */
    .adm-section-title {
      font-size: 11px; font-weight: 700; color: #555;
      text-transform: uppercase; letter-spacing: .8px;
      margin: 18px 0 10px;
    }

    /* Book card (admin) */
    .adm-book-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 14px; margin-bottom: 10px;
      display: flex; align-items: flex-start; gap: 12px;
    }
    .adm-book-cover {
      width: 44px; height: 60px; border-radius: 6px; flex-shrink: 0;
      display: flex; flex-direction: column; justify-content: space-between;
      padding: 4px;
    }
    .adm-book-cover-genre  { font-size: 5px; color: rgba(255,255,255,.7); text-transform: uppercase; }
    .adm-book-cover-title  { font-size: 7px; font-weight: 900; color: #fff; text-align: center; line-height: 1.2; }
    .adm-book-cover-author { font-size: 5px; color: rgba(255,255,255,.7); text-align: center; }
    .adm-book-info { flex: 1; min-width: 0; }
    .adm-book-title  { font-size: 13px; font-weight: 700; color: #fff; margin-bottom: 2px; }
    .adm-book-author { font-size: 11px; color: var(--orange); margin-bottom: 4px; }
    .adm-book-meta   { font-size: 11px; color: #666; }
    .adm-book-actions { display: flex; gap: 6px; margin-top: 8px; }
    .adm-tag { display: inline-block; font-size: 9px; font-weight: 700; padding: 2px 7px; border-radius: 20px; margin-right: 3px; }
    .adm-tag-new  { background: rgba(46,204,113,.12); color: #2ecc71; border: 1px solid rgba(46,204,113,.25); }
    .adm-tag-rec  { background: rgba(52,152,219,.12); color: #3498db; border: 1px solid rgba(52,152,219,.25); }
    .adm-tag-best { background: rgba(232,148,58,.12); color: #e8943a; border: 1px solid rgba(232,148,58,.25); }

    /* Order card (admin) */
    .adm-order-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 14px; margin-bottom: 10px;
    }
    .adm-order-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
    .adm-order-id  { font-size: 11px; color: #888; font-family: monospace; }
    .adm-order-date{ font-size: 11px; color: #555; margin-top: 2px; }
    .adm-order-books { font-size: 12px; color: #888; margin-bottom: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .adm-order-bottom { display: flex; justify-content: space-between; align-items: center; }
    .adm-order-total { font-size: 15px; font-weight: 700; color: #fff; }

    /* Status pills */
    .pill { display: inline-block; font-size: 10px; font-weight: 700; padding: 3px 9px; border-radius: 20px; }
    .pill-green  { background: rgba(46,204,113,.12);  color: #2ecc71; border: 1px solid rgba(46,204,113,.25); }
    .pill-red    { background: rgba(231,76,60,.12);   color: #e74c3c; border: 1px solid rgba(231,76,60,.25); }
    .pill-orange { background: rgba(232,148,58,.12);  color: #e8943a; border: 1px solid rgba(232,148,58,.25); }
    .pill-blue   { background: rgba(52,152,219,.12);  color: #3498db; border: 1px solid rgba(52,152,219,.25); }

    /* Action buttons */
    .adm-btn { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; padding: 6px 12px; border-radius: 8px; cursor: pointer; border: none; }
    .adm-btn-edit    { background: rgba(52,152,219,.12); color: #3498db; border: 1px solid rgba(52,152,219,.3); }
    .adm-btn-danger  { background: rgba(231,76,60,.12);  color: #e74c3c; border: 1px solid rgba(231,76,60,.3); }
    .adm-btn-primary { background: var(--orange); color: #fff; border: none; }

    /* FAB add button */
    .adm-fab {
      position: fixed; bottom: calc(var(--bottom-h) + 16px + var(--safe-bottom));
      right: 16px; z-index: 150;
      width: 52px; height: 52px; border-radius: 50%;
      background: var(--orange); color: #fff;
      font-size: 26px; font-weight: 300; border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 20px rgba(232,148,58,.4);
    }

    /* Search bar */
    .adm-search-bar {
      background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
      color: #fff; font-size: 14px; padding: 10px 14px; outline: none; width: 100%;
      margin-bottom: 14px;
    }
    .adm-search-bar:focus { border-color: #444; }
    .adm-search-bar::placeholder { color: #444; }

    /* Filter row */
    .adm-filter-row { display: flex; gap: 8px; margin-bottom: 14px; }
    .adm-filter-sel {
      flex: 1; background: var(--surface); border: 1px solid var(--border);
      border-radius: 10px; color: #fff; font-size: 13px; padding: 9px 12px;
      outline: none; -webkit-appearance: none;
    }

    /* Modal bottom sheet */
    .adm-sheet-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,.75); z-index: 500;
    }
    .adm-sheet-overlay.open { display: block; }
    .adm-sheet {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 600;
      background: #141414; border-radius: 18px 18px 0 0;
      border-top: 1px solid #2a2a2a;
      max-height: 90vh; overflow-y: auto;
      padding: 0 16px 32px;
      transform: translateY(100%);
      transition: transform .3s cubic-bezier(.4,0,.2,1);
    }
    .adm-sheet.open { transform: translateY(0); }
    .adm-sheet-handle {
      width: 36px; height: 4px; border-radius: 2px;
      background: #333; margin: 12px auto 18px;
    }
    .adm-sheet-title { font-size: 16px; font-weight: 800; color: #fff; margin-bottom: 18px; }
    .adm-field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 14px; }
    .adm-field label { font-size: 10px; color: #666; font-weight: 700; text-transform: uppercase; letter-spacing: .6px; }
    .adm-field input, .adm-field select, .adm-field textarea {
      background: #0f0f0f; border: 1px solid #2a2a2a; border-radius: 10px;
      color: #fff; font-size: 14px; padding: 11px 13px; outline: none; width: 100%;
      font-family: inherit;
    }
    .adm-field input:focus, .adm-field select:focus, .adm-field textarea:focus { border-color: var(--orange); }
    .adm-field textarea { resize: vertical; min-height: 72px; }
    .adm-field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .adm-sheet-save {
      width: 100%; background: var(--orange); color: #fff; border: none;
      padding: 14px; border-radius: 12px; font-size: 15px; font-weight: 700;
      cursor: pointer; margin-top: 6px; font-family: inherit;
    }
    .adm-sheet-cancel {
      width: 100%; background: transparent; color: #888; border: none;
      padding: 12px; font-size: 14px; cursor: pointer; margin-top: 4px;
      font-family: inherit;
    }

    /* User card */
    .adm-user-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 16px; display: flex; align-items: center; gap: 14px;
    }
    .adm-user-avatar {
      width: 44px; height: 44px; border-radius: 50%;
      background: var(--orange); color: #fff;
      font-size: 18px; font-weight: 800; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
    }
    .adm-user-name  { font-size: 14px; font-weight: 700; color: #fff; }
    .adm-user-email { font-size: 11px; color: #666; margin-top: 2px; }
    .adm-user-meta  { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }

    /* Empty state */
    .adm-empty { text-align: center; padding: 40px 20px; color: #555; font-size: 13px; }
    .adm-empty-icon { font-size: 36px; margin-bottom: 10px; }

    /* Toast */
    #toast {
      position: fixed; bottom: calc(var(--bottom-h) + 12px); left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #1e1e1e; border: 1px solid #333; color: #fff;
      padding: 10px 20px; border-radius: 10px; font-size: 13px;
      opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none;
      white-space: nowrap; z-index: 2000;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* Panels */
    .adm-panel { display: none; }
    .adm-panel.active { display: block; }
    .adm-page-title { font-size: 20px; font-weight: 800; color: #fff; margin-bottom: 4px; }
    .adm-page-sub   { font-size: 12px; color: #555; margin-bottom: 18px; }
  </style>
</head>
<body>

  <!-- Top Navbar -->
  <nav class="navbar">
    <div class="nav-brand-wrap">
      <div class="nav-grid-icon"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
      <span class="nav-brand">Book Worm</span>
    </div>
    <div class="nav-spacer"></div>
    <div class="nav-right-icons">
      <span class="adm-role-badge">ADMIN</span>
      <button class="nav-icon-btn" onclick="admLogout()" title="Sign Out" style="font-size:16px">⎋</button>
    </div>
  </nav>

  <!-- Page Body -->
  <div class="page-body" id="pageBody">

    <!-- ── DASHBOARD panel ── -->
    <div class="adm-panel active" id="panel-dashboard">
      <div class="adm-page-title">Dashboard</div>
      <div class="adm-page-sub" id="admGreeting">Welcome, Admin</div>
      <div class="stat-grid" id="statGrid"></div>
      <div class="adm-section-title">Recent Orders</div>
      <div id="recentOrdersList"></div>
      <div class="adm-section-title">Top Books</div>
      <div id="topBooksList"></div>
    </div>

    <!-- ── BOOKS panel ── -->
    <div class="adm-panel" id="panel-books">
      <div class="adm-page-title">Books</div>
      <div class="adm-page-sub">Manage your catalogue</div>
      <input class="adm-search-bar" id="bookSearch" placeholder="🔍  Search books or authors…" oninput="renderBooks()"/>
      <div id="booksList"></div>
    </div>

    <!-- ── ORDERS panel ── -->
    <div class="adm-panel" id="panel-orders">
      <div class="adm-page-title">Orders</div>
      <div class="adm-page-sub">View and update all orders</div>
      <input class="adm-search-bar" id="orderSearch" placeholder="🔍  Search by order ID…" oninput="renderOrders()"/>
      <div class="adm-filter-row">
        <select class="adm-filter-sel" id="orderStatusFilter" onchange="renderOrders()">
          <option value="">All Statuses</option>
          <option>Confirmed</option><option>Processing</option><option>Shipped</option>
          <option>Delivered</option><option>Cancelled</option>
        </select>
      </div>
      <div id="ordersList"></div>
    </div>

    <!-- ── USERS panel ── -->
    <div class="adm-panel" id="panel-users">
      <div class="adm-page-title">Users</div>
      <div class="adm-page-sub">Current session data</div>
      <div id="usersList"></div>
    </div>

    <!-- ── STORES panel ── -->
    <div class="adm-panel" id="panel-stores">
      <div class="adm-page-title">Stores</div>
      <div class="adm-page-sub">3 curated stores · 45 books distributed</div>
      <div id="storesList"></div>
    </div>

  </div>

  <!-- FAB: Add Book (only on books panel) -->
  <button class="adm-fab" id="fabBtn" onclick="openBookSheet()" style="display:none">＋</button>

  <!-- Bottom nav -->
  <nav class="bottom-nav">
    <a class="bn-tab active" id="bnDash"   onclick="showPanel('dashboard')" href="#">
      <span class="bn-icon">📊</span><span class="bn-label">Dashboard</span>
    </a>
    <a class="bn-tab" id="bnBooks"  onclick="showPanel('books')" href="#">
      <span class="bn-icon">📚</span><span class="bn-label">Books</span>
    </a>
    <a class="bn-tab" id="bnOrders" onclick="showPanel('orders')" href="#">
      <span class="bn-icon">📦</span><span class="bn-label">Orders</span>
    </a>
    <a class="bn-tab" id="bnStores" onclick="showPanel('stores')" href="#">
      <span class="bn-icon">🏪</span><span class="bn-label">Stores</span>
    </a>
    <a class="bn-tab" id="bnUsers"  onclick="showPanel('users')" href="#">
      <span class="bn-icon">👥</span><span class="bn-label">Users</span>
    </a>
  </nav>

  <!-- ── Book Add/Edit Bottom Sheet ── -->
  <div class="adm-sheet-overlay" id="bookSheetOverlay" onclick="closeBookSheet()"></div>
  <div class="adm-sheet" id="bookSheet">
    <div class="adm-sheet-handle"></div>
    <div class="adm-sheet-title" id="bookSheetTitle">Add Book</div>
    <div class="adm-field"><label>Title</label><input id="mTitle" placeholder="Book title"/></div>
    <div class="adm-field-row">
      <div class="adm-field"><label>Author</label><input id="mAuthor" placeholder="Author name"/></div>
      <div class="adm-field"><label>Price (₹)</label><input id="mPrice" type="number" placeholder="299"/></div>
    </div>
    <div class="adm-field-row">
      <div class="adm-field"><label>Category</label>
        <select id="mCategory">
          <option>Self-help</option><option>Mystery</option><option>Romance</option>
          <option>Science Fiction</option><option>Fantasy</option><option>Historical</option>
          <option>Biography</option><option>Memoir</option><option>Travel</option>
          <option>Cooking</option><option>Children's</option><option>Young Adult</option>
          <option>Comics & Graphic Novels</option><option>Poetry</option><option>Drama</option>
          <option>Science</option><option>Philosophy</option><option>Religion</option>
          <option>Language Learning</option><option>Fiction</option>
        </select>
      </div>
      <div class="adm-field"><label>Format</label>
        <select id="mFormat"><option>Paperback</option><option>Hard Cover</option><option>eBook</option></select>
      </div>
    </div>
    <div class="adm-field-row">
      <div class="adm-field"><label>Original Price (₹)</label><input id="mOriginalPrice" type="number" placeholder="499"/></div>
      <div class="adm-field"><label>Stock</label><input id="mStock" type="number" placeholder="50"/></div>
    </div>
    <div class="adm-field-row">
      <div class="adm-field"><label>Rating (0-5)</label><input id="mRating" type="number" step="0.1" min="0" max="5" placeholder="4.2"/></div>
      <div class="adm-field"><label>Cover Colour</label><input id="mCoverBg" type="color" value="#3b82f6" style="height:44px;padding:4px"/></div>
    </div>
    <div class="adm-field"><label>Description</label><textarea id="mDesc" placeholder="Short description…"></textarea></div>
    <div class="adm-field"><label>Tags (recommended, bestseller, new)</label><input id="mTags" placeholder="recommended, bestseller"/></div>
    <div class="adm-field-row">
      <div class="adm-field"><label>Delivery Date</label><input id="mDelivery" placeholder="Mon, 21 Jul"/></div>
      <div class="adm-field"><label>Publisher</label><input id="mBrand" placeholder="Publisher"/></div>
    </div>
    <button class="adm-sheet-save" onclick="saveBook()">Save Book</button>
    <button class="adm-sheet-cancel" onclick="closeBookSheet()">Cancel</button>
  </div>

  <!-- ── Order Status Sheet ── -->
  <div class="adm-sheet-overlay" id="orderSheetOverlay" onclick="closeOrderSheet()"></div>
  <div class="adm-sheet" id="orderSheet">
    <div class="adm-sheet-handle"></div>
    <div class="adm-sheet-title">Update Order Status</div>
    <div class="adm-field" style="margin-bottom:8px"><label>Order ID</label><input id="oModalId" readonly style="opacity:.5"/></div>
    <div class="adm-field"><label>New Status</label>
      <select id="oModalStatus">
        <option>Confirmed</option><option>Processing</option><option>Shipped</option>
        <option>Delivered</option><option>Cancelled</option>
      </select>
    </div>
    <button class="adm-sheet-save" onclick="saveOrderStatus()">Update Status</button>
    <button class="adm-sheet-cancel" onclick="closeOrderSheet()">Cancel</button>
  </div>

  <div id="toast"></div>

  <script src="data.js"></script>
  <script src="app.js"></script>
  <script>
    requireAdmin();
    const SC = {Confirmed:'pill-blue',Processing:'pill-orange',Shipped:'pill-orange',Delivered:'pill-green',Cancelled:'pill-red'};

    // ── Panel switching ──────────────────
    function showPanel(id) {
      document.querySelectorAll('.adm-panel').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.bn-tab').forEach(t => t.classList.remove('active'));
      document.getElementById('panel-' + id).classList.add('active');
      const bnMap = {dashboard:'bnDash', books:'bnBooks', orders:'bnOrders', users:'bnUsers', stores:'bnStores'};
      if (bnMap[id]) document.getElementById(bnMap[id]).classList.add('active');
      document.getElementById('fabBtn').style.display = id === 'books' ? 'flex' : 'none';
      if (id === 'dashboard') renderDashboard();
      if (id === 'books')     renderBooks();
      if (id === 'orders')    renderOrders();
      if (id === 'users')     renderUsers();
      if (id === 'stores')    renderStores();
    }

    function admLogout() {
      localStorage.removeItem('bw_user');
      window.location.href = 'login.html';
    }

    // ── DASHBOARD ───────────────────────
    function renderDashboard() {
      const u = getUser();
      document.getElementById('admGreeting').textContent = 'Welcome back, ' + (u?.name || 'Admin') + ' 👋';

      const orders = getOrders();
      const books  = getAllBooks();
      const revenue = orders.filter(o => o.status !== 'Cancelled')
        .reduce((s, o) => s + parseInt(String(o.total||'0').replace(/[₹,]/g,'')||0), 0);
      const prem = JSON.parse(localStorage.getItem('bw_premium')||'null');

      document.getElementById('statGrid').innerHTML = [
        { icon:'📚', val: books.length,                                          lbl: 'Books'     },
        { icon:'📦', val: orders.length,                                         lbl: 'Orders'    },
        { icon:'✅', val: orders.filter(o=>o.status==='Delivered').length,        lbl: 'Delivered' },
        { icon:'❌', val: orders.filter(o=>o.status==='Cancelled').length,        lbl: 'Cancelled' },
        { icon:'💰', val: '₹'+revenue,                                           lbl: 'Revenue'   },
        { icon:'👑', val: prem&&prem.expiry>Date.now() ? '1' : '0',              lbl: 'Premium'   },
      ].map(s => `<div class="stat-card">
        <div class="stat-icon">${s.icon}</div>
        <div class="stat-val">${s.val}</div>
        <div class="stat-lbl">${s.lbl}</div>
      </div>`).join('');

      // Recent orders (last 4)
      const ro = orders.slice(0, 4);
      document.getElementById('recentOrdersList').innerHTML = ro.length ? ro.map((o,idx) => {
        const s = o.status||'Confirmed';
        return `<div class="adm-order-card">
          <div class="adm-order-top">
            <div>
              <div class="adm-order-id">#${o.id||'—'}</div>
              <div class="adm-order-date">${o.date||'—'}</div>
            </div>
            <span class="pill ${SC[s]||'pill-blue'}">${s}</span>
          </div>
          <div class="adm-order-books">${(o.items||[]).map(i=>i.title).join(', ').slice(0,50)||'—'}</div>
          <div class="adm-order-bottom">
            <div class="adm-order-total">${String(o.total||'—').replace(/₹+/,'₹')}</div>
          </div>
        </div>`;
      }).join('') : '<div class="adm-empty"><div class="adm-empty-icon">📦</div>No orders yet</div>';

      // Top 3 books by sales
      document.getElementById('topBooksList').innerHTML = books
        .sort((a,b)=>(b.sales||0)-(a.sales||0)).slice(0,3)
        .map(b => `<div class="adm-book-card">
          <div class="adm-book-cover" style="background:${b.coverBg}">
            <div class="adm-book-cover-genre">${b.category}</div>
            <div class="adm-book-cover-title">${b.coverText||b.title}</div>
            <div class="adm-book-cover-author">${b.coverAuthorDisplay||b.author}</div>
          </div>
          <div class="adm-book-info">
            <div class="adm-book-title">${b.title}</div>
            <div class="adm-book-author">${b.author}</div>
            <div class="adm-book-meta">₹${b.price} · ${b.sales||0} sold · ⭐ ${b.rating||'—'}</div>
          </div>
        </div>`).join('');
    }

    // ── BOOKS ────────────────────────────
    let editingBookId = null;

    function renderBooks() {
      const q = (document.getElementById('bookSearch')?.value||'').toLowerCase();
      const books = getAllBooks().filter(b => !q || b.title.toLowerCase().includes(q) || b.author.toLowerCase().includes(q));
      document.getElementById('booksList').innerHTML = books.map(b => {
        const isNew = getCustomBooks().find(c => c.id === b.id && !BOOKS.find(x => x.id === b.id));
        const tagHtml = (b.tags||[]).map(t => {
          const cls = t==='new'?'adm-tag-new':t==='bestseller'?'adm-tag-best':'adm-tag-rec';
          return `<span class="adm-tag ${cls}">${t}</span>`;
        }).join('');
        return `<div class="adm-book-card">
          <div class="adm-book-cover" style="background:${b.coverBg}">
            <div class="adm-book-cover-genre">${b.category}</div>
            <div class="adm-book-cover-title">${b.coverText||b.title}</div>
            <div class="adm-book-cover-author">${b.coverAuthorDisplay||b.author}</div>
          </div>
          <div class="adm-book-info">
            <div class="adm-book-title">${b.title}${isNew?'<span class="adm-tag adm-tag-new" style="margin-left:5px">New</span>':''}</div>
            <div class="adm-book-author">by ${b.author}</div>
            <div class="adm-book-meta">₹${b.price} · Stock: ${b.stock||0} · ⭐${b.rating||'—'}</div>
            <div style="margin-top:4px">${tagHtml}</div>
            <div class="adm-book-actions">
              <button class="adm-btn adm-btn-edit" onclick="editBook(${b.id})">✏️ Edit</button>
              <button class="adm-btn adm-btn-danger" onclick="deleteBook(${b.id})">🗑 Delete</button>
            </div>
          </div>
        </div>`;
      }).join('') || '<div class="adm-empty"><div class="adm-empty-icon">📚</div>No books found</div>';
    }

    function openBookSheet(book) {
      editingBookId = book ? book.id : null;
      document.getElementById('bookSheetTitle').textContent = book ? 'Edit Book' : 'Add Book';
      document.getElementById('mTitle').value         = book?.title         || '';
      document.getElementById('mAuthor').value        = book?.author        || '';
      document.getElementById('mCategory').value      = book?.category      || 'Self-help';
      document.getElementById('mFormat').value        = book?.format        || 'Paperback';
      document.getElementById('mPrice').value         = book?.price         || '';
      document.getElementById('mOriginalPrice').value = book?.originalPrice || '';
      document.getElementById('mStock').value         = book?.stock         || '';
      document.getElementById('mRating').value        = book?.rating        || '';
      document.getElementById('mCoverBg').value       = book?.coverBg       || '#3b82f6';
      document.getElementById('mDesc').value          = book?.desc          || '';
      document.getElementById('mTags').value          = (book?.tags||[]).join(', ');
      document.getElementById('mDelivery').value      = book?.delivery      || '';
      document.getElementById('mBrand').value         = book?.brand         || '';
      document.getElementById('bookSheetOverlay').classList.add('open');
      document.getElementById('bookSheet').classList.add('open');
    }
    function closeBookSheet() {
      document.getElementById('bookSheetOverlay').classList.remove('open');
      document.getElementById('bookSheet').classList.remove('open');
    }
    function editBook(id) {
      const b = getAllBooks().find(b => b.id === id);
      if (b) openBookSheet(b);
    }
    function saveBook() {
      const title  = document.getElementById('mTitle').value.trim();
      const author = document.getElementById('mAuthor').value.trim();
      if (!title || !author) { showToast('Title and Author are required'); return; }
      const cat   = document.getElementById('mCategory').value;
      const price = parseInt(document.getElementById('mPrice').value) || 0;
      const book  = {
        id:    editingBookId || Date.now(),
        title, author,
        category: cat, genres: [cat],
        format:   document.getElementById('mFormat').value,
        language: 'English',
        price,
        originalPrice:      parseInt(document.getElementById('mOriginalPrice').value) || price,
        stock:              parseInt(document.getElementById('mStock').value) || 0,
        rating:             parseFloat(document.getElementById('mRating').value) || 4.0,
        coverBg:            document.getElementById('mCoverBg').value,
        coverText:          title.toUpperCase(),
        coverAuthorDisplay: author.toUpperCase(),
        desc:               document.getElementById('mDesc').value.trim(),
        tags:               document.getElementById('mTags').value.split(',').map(t=>t.trim()).filter(Boolean),
        delivery:           document.getElementById('mDelivery').value.trim() || 'Mon, 21 Jul',
        brand:              document.getElementById('mBrand').value.trim(),
        sales: 0,
      };
      const custom = getCustomBooks();
      const idx = custom.findIndex(c => c.id === book.id);
      if (idx >= 0) custom[idx] = book; else custom.push(book);
      saveCustomBooks(custom);
      closeBookSheet();
      renderBooks();
      showToast(editingBookId ? 'Book updated ✓' : 'Book added to store ✓');
    }
    function deleteBook(id) {
      if (!confirm('Delete this book?')) return;
      const custom = getCustomBooks();
      const base   = BOOKS.find(b => b.id === id);
      if (base) {
        const idx = custom.findIndex(c => c.id === id);
        if (idx >= 0) custom[idx]._deleted = true; else custom.push({ id, _deleted: true });
      } else {
        const idx = custom.findIndex(c => c.id === id);
        if (idx >= 0) custom.splice(idx, 1);
      }
      saveCustomBooks(custom);
      renderBooks();
      showToast('Book removed from store');
    }

    // ── ORDERS ───────────────────────────
    let editingOrderIdx = null;

    function renderOrders() {
      const q      = (document.getElementById('orderSearch')?.value||'').toLowerCase();
      const filter = document.getElementById('orderStatusFilter')?.value||'';
      let orders = getOrders();
      if (q)      orders = orders.filter(o => (o.id||'').toLowerCase().includes(q));
      if (filter) orders = orders.filter(o => o.status === filter);
      document.getElementById('ordersList').innerHTML = orders.map((o, idx) => {
        const s = o.status||'Confirmed';
        return `<div class="adm-order-card">
          <div class="adm-order-top">
            <div>
              <div class="adm-order-id">#${o.id||'—'}</div>
              <div class="adm-order-date">${o.date||'—'}</div>
            </div>
            <span class="pill ${SC[s]||'pill-blue'}">${s}</span>
          </div>
          <div class="adm-order-books">${(o.items||[]).map(i=>i.title).join(', ').slice(0,60)||'—'}</div>
          <div class="adm-order-bottom">
            <div class="adm-order-total">${String(o.total||'—').replace(/₹+/,'₹')}</div>
            <button class="adm-btn adm-btn-edit" onclick="openOrderSheet(${idx},'${o.id||''}','${s}')">✏️ Status</button>
          </div>
        </div>`;
      }).join('') || '<div class="adm-empty"><div class="adm-empty-icon">📦</div>No orders found</div>';
    }

    function openOrderSheet(idx, id, status) {
      editingOrderIdx = idx;
      document.getElementById('oModalId').value = '#' + id;
      document.getElementById('oModalStatus').value = status;
      document.getElementById('orderSheetOverlay').classList.add('open');
      document.getElementById('orderSheet').classList.add('open');
    }
    function closeOrderSheet() {
      document.getElementById('orderSheetOverlay').classList.remove('open');
      document.getElementById('orderSheet').classList.remove('open');
    }
    function saveOrderStatus() {
      const orders = getOrders();
      if (editingOrderIdx === null || !orders[editingOrderIdx]) return;
      orders[editingOrderIdx].status = document.getElementById('oModalStatus').value;
      localStorage.setItem('bw_orders', JSON.stringify(orders));
      closeOrderSheet();
      renderOrders();
      showToast('Order status updated ✓');
    }

    // ── USERS ────────────────────────────
    function renderUsers() {
      const u    = getUser();
      const ords = getOrders();
      const prem = JSON.parse(localStorage.getItem('bw_premium')||'null');
      const pts  = localStorage.getItem('bw_gift_points')||'0';
      document.getElementById('usersList').innerHTML = u ? `
        <div class="adm-user-card">
          <div class="adm-user-avatar">${(u.name||'U').charAt(0).toUpperCase()}</div>
          <div>
            <div class="adm-user-name">${u.name||'—'}</div>
            <div class="adm-user-email">${u.email||'guest'}</div>
            <div class="adm-user-meta">
              <span class="pill ${u.role==='admin'?'pill-red':u.role==='guest'?'pill-orange':'pill-green'}">${u.role||'user'}</span>
              ${prem&&prem.expiry>Date.now()?'<span class="pill pill-orange">👑 Premium</span>':''}
              <span class="pill pill-blue">${ords.length} orders</span>
              <span class="pill" style="background:#1a1a1a;color:#666;border:1px solid #222">${pts} gift pts</span>
            </div>
          </div>
        </div>
        <p style="font-size:11px;color:#444;margin-top:12px;text-align:center">Only current browser session data is shown here.</p>
      ` : '<div class="adm-empty"><div class="adm-empty-icon">👤</div>No user session found</div>';
    }

    // ── STORES ───────────────────────────
    function renderStores() {
      const container = document.getElementById('storesList');
      container.innerHTML = STORES.map(s => {
        const books = BOOKS.filter(b => s.bookIds.includes(b.id));
        const totalSales = books.reduce((sum, b) => sum + (b.sales || 0), 0);

        // Policy rows
        const policyItems = [
          ['↩️', 'Returns',  s.policy.returns ],
          ['🚚', 'Delivery', s.policy.delivery],
          ['💳', 'Payment',  s.policy.payment ],
          ['🛡️', 'Warranty', s.policy.warranty],
          ['🎁', 'Loyalty',  s.policy.loyalty ],
          ['📞', 'Contact',  s.policy.contact ],
        ];

        // Catalog summary
        const catalogSummary = s.catalog.map(sec => {
          const secBooks = BOOKS.filter(b => sec.ids.includes(b.id));
          return `<div style="margin-bottom:10px">
            <div style="font-size:10px;font-weight:700;color:#555;text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px">${sec.section}</div>
            <div style="display:flex;gap:6px;overflow-x:auto;padding-bottom:4px">
              ${secBooks.map(b => `
                <div style="flex-shrink:0;width:52px;cursor:pointer" onclick="goBook&&goBook(${b.id})">
                  <div style="width:52px;height:72px;border-radius:6px;background:${b.coverBg};display:flex;flex-direction:column;justify-content:space-between;padding:4px;margin-bottom:3px">
                    <div style="font-size:5px;color:rgba(255,255,255,.7);text-transform:uppercase">${b.category}</div>
                    <div style="font-size:6px;font-weight:900;color:#fff;text-align:center;line-height:1.2">${b.coverText||b.title}</div>
                    <div style="font-size:5px;color:rgba(255,255,255,.7);text-align:center">${(b.coverAuthorDisplay||b.author).split(' ').pop()}</div>
                  </div>
                  <div style="font-size:10px;color:#aaa;line-height:1.2;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical">${b.title}</div>
                  <div style="font-size:10px;color:var(--orange);font-weight:700">₹${b.price}</div>
                </div>`).join('')}
            </div>
          </div>`;
        }).join('');

        return `<div style="background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:16px">
          <!-- Store header -->
          <div style="background:${s.coverColor};padding:16px">
            <div style="display:flex;align-items:center;gap:12px;margin-bottom:8px">
              <span style="font-size:32px">${s.emoji}</span>
              <div>
                <div style="font-size:16px;font-weight:800;color:#fff">${s.name}</div>
                <div style="font-size:11px;color:rgba(255,255,255,.6)">${s.tagline}</div>
              </div>
              <a href="stores.html" style="margin-left:auto;background:rgba(255,255,255,.15);color:#fff;font-size:11px;font-weight:700;padding:5px 12px;border-radius:20px;text-decoration:none;flex-shrink:0">View →</a>
            </div>
            <div style="font-size:12px;color:rgba(255,255,255,.7);line-height:1.5">${s.description}</div>
            <!-- Stats row -->
            <div style="display:flex;gap:14px;margin-top:12px">
              ${[['📚',s.bookIds.length,'Books'],['⭐',s.rating,'Rating'],['📍',s.location.split(',')[0],'Location'],['📅',s.founded,'Since']].map(
                ([ic,v,l])=>`<div><div style="font-size:13px;font-weight:800;color:#fff">${ic} ${v}</div><div style="font-size:9px;color:rgba(255,255,255,.5);text-transform:uppercase;letter-spacing:.5px">${l}</div></div>`
              ).join('')}
            </div>
          </div>

          <!-- Tabs -->
          <div style="display:flex;border-bottom:1px solid var(--border)">
            <div style="flex:1;padding:11px 0;text-align:center;font-size:12px;font-weight:700;color:var(--orange);border-bottom:2px solid var(--orange);cursor:pointer" onclick="admToggleStoreTab('${s.id}','catalog',this)">📋 Catalogue</div>
            <div style="flex:1;padding:11px 0;text-align:center;font-size:12px;font-weight:600;color:#666;cursor:pointer" onclick="admToggleStoreTab('${s.id}','policy',this)">📜 Policies</div>
          </div>

          <!-- Catalogue tab -->
          <div id="adm-store-catalog-${s.id}" style="padding:14px">
            ${catalogSummary}
          </div>

          <!-- Policy tab -->
          <div id="adm-store-policy-${s.id}" style="display:none;padding:14px">
            ${policyItems.map(([ic,lbl,txt])=>`
              <div style="display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--border)">
                <span style="font-size:18px;flex-shrink:0">${ic}</span>
                <div>
                  <div style="font-size:10px;font-weight:700;color:#555;text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px">${lbl}</div>
                  <div style="font-size:13px;color:#ccc;line-height:1.5">${txt}</div>
                </div>
              </div>`).join('')}
          </div>
        </div>`;
      }).join('');
    }

    function admToggleStoreTab(storeId, tab, el) {
      const catalog = document.getElementById('adm-store-catalog-' + storeId);
      const policy  = document.getElementById('adm-store-policy-'  + storeId);
      const tabs = el.parentElement.querySelectorAll('div');
      tabs.forEach(t => { t.style.color = '#666'; t.style.borderBottom = 'none'; });
      el.style.color = 'var(--orange)';
      el.style.borderBottom = '2px solid var(--orange)';
      if (tab === 'catalog') { catalog.style.display = 'block'; policy.style.display = 'none'; }
      else                   { catalog.style.display = 'none';  policy.style.display = 'block'; }
    }

    function goBook(id) { window.open('book.html?id=' + id, '_blank'); }

    // ── Toast ───────────────────────────
    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(t._t);
      t._t = setTimeout(() => t.classList.remove('show'), 2400);
    }

    // ── Init ─────────────────────────────
    renderDashboard();
  </script>
</body>
</html>
