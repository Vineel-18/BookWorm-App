      </a>
      <div class="user-dd-wrap">
        <button class="nav-profile-btn" onclick="toggleDD()" title="Profile">
          <span class="nav-avatar" id="navAvatar">U</span>
        </button>
        <div class="user-dd-menu" id="userMenu">

            <div class="udp-avatar" id="udpAvatar">U</div>
            <div class="udp-info">

              <div class="udp-email" id="uEmail"></div>
              <div id="udpPremBadge" style="display:none"></div>
            </div>
          </div>
          <div class="user-dd-links">
            <a href="dashboard.html">👤 My Profile</a>
            <a href="orders.html">📦 My Orders</a>
            <a href="wishlist.html">🤍 Wishlist</a>
            <a href="premium.html">👑 Premium</a>

      </div>

  <div class="page-body">
    <div class="page-header">
      <h2 class="page-title">My Orders</h2>
    </div>
    <div id="ordersContainer"></div>
  </div>

  <nav class="bottom-nav">
    <a href="index.html"    class="bn-tab"><span class="bn-icon">🏠</span><span class="bn-label">Home</span></a>
    <a href="orders.html"   class="bn-tab active"><span class="bn-icon">📦</span><span class="bn-label">Orders</span></a>
    <a href="wishlist.html" class="bn-tab"><span class="bn-icon">🤍</span><span class="bn-label">Wishlist</span></a>
    <a href="cart.html"     class="bn-tab"><span class="bn-icon">🛒</span><span class="bn-label">Cart</span></a>
    <a href="premium.html"  class="bn-tab" id="premTab"><span class="bn-icon">👑</span><span class="bn-label">Premium</span></a>
  </nav>

  <!-- Return Bottom Sheet -->
  <div class="return-sheet-overlay" id="returnSheetOverlay" onclick="closeReturnSheet()"></div>
  <div class="return-sheet" id="returnSheet">
    <div class="return-sheet-handle"></div>
    <div class="return-sheet-title">Return Request</div>
    <div class="return-sheet-sub">Select a reason for returning this order</div>
    <div class="return-reasons" id="returnReasonsList"></div>
    <div class="return-note-label">Additional notes (optional)</div>
    <textarea class="return-note-input" id="returnNote" rows="3" placeholder="Describe the issue…"></textarea>
    <button class="return-submit-btn" id="returnSubmitBtn" onclick="submitReturn()" disabled>Submit Return Request</button>
  </div>

  <div id="toast"></div>
  <script src="data.js"></script>
  <script src="app.js"></script>
  <script>
    // Stage icons for the tracker dots
    const STAGE_ICONS = ['✓','📦','🚚','📍','🏠'];

    // Stage timestamps keyed by stage index
    function stageTs(o, i) {
      return [o.placedAt, o.packedAt, o.shippedAt, o.outAt, o.deliveredAt][i] || 0;
    }

    function statusClass(s) {
      s = (s || '').toLowerCase();
      if (s === 'cancelled')        return 'order-status-cancelled';
      if (s === 'return requested') return 'order-status-return-requested';
      if (s === 'returned')         return 'order-status-returned';
      return '';
    }

    function cancelOrder(orderId) {
      if (!confirm('Cancel this order?')) return;
      const orders = getOrders();
      const o = orders.find(x => x.id === orderId);
      if (!o) return;
      o.status = 'Cancelled';
      localStorage.setItem('bw_orders', JSON.stringify(orders));
      showToast('Order cancelled');
      renderOrdersList();
    }

    function buildTracker(o, liveStatus) {
      const s = liveStatus.toLowerCase();
      if (['cancelled', 'return requested', 'returned'].includes(s)) return '';

      const hasTimeline = !!(o.placedAt && o.deliveredAt);
      const curIdx = stageIndex(liveStatus);   // from app.js
      const now    = Date.now();

      // EDD line
      let eddHtml = '';
      if (o.deliveredAt) {
        const isPast  = now >= o.deliveredAt;
        const eddDate = fmtTs(o.deliveredAt);

        // delivery type tag
        const typeMap = {
          fast:      { cls: 'fast', txt: '⚡ Fast' },
          sameday:   { cls: 'same', txt: '🟢 Same-Day' },
          prem_same: { cls: 'prem', txt: '👑 Same-Day' },
          prem_next: { cls: 'prem', txt: '👑 Next-Day' },
        };
        const typeInfo = typeMap[o.delivType];
        const typeTag  = typeInfo
          ? `<span class="dopt-badge ${typeInfo.cls}" style="font-size:10px">${typeInfo.txt}</span>`
          : (o.isPremOrder ? `<span class="tracker-prem-tag">👑 Express</span>` : '');

        if (isPast) {
          eddHtml = `<div class="tracker-edd">
            Delivered on <span class="tracker-edd-val">${eddDate}</span> ${typeTag}
          </div>`;
        } else {
          eddHtml = `<div class="tracker-edd">
            Expected by <span class="tracker-edd-val">${eddDate}</span> ${typeTag}
          </div>`;
        }
      }

      // Steps
      const stepsHtml = ORDER_STAGES.map((label, i) => {
        let cls = '';
        if (i < curIdx)       cls = 'done';
        else if (i === curIdx) cls = 'active';

        const ts   = hasTimeline ? stageTs(o, i) : 0;
        const dateStr = ts ? fmtTs(ts) : '';
        const icon = i === curIdx ? STAGE_ICONS[i] : (i < curIdx ? '✓' : '');

        return `<div class="tracker-step ${cls}">
          <div class="ts-dot">${icon}</div>
          <div class="ts-label">${label}</div>
          <div class="ts-date">${dateStr}</div>
        </div>`;
      }).join('');

      return `<div class="order-tracker">
        ${eddHtml}
        <div class="tracker-steps">${stepsHtml}</div>
      </div>`;
    }

    function renderOrdersList() {
      const el = document.getElementById('ordersContainer');
      const orders = getOrders();
      if (!orders.length) {
        el.innerHTML = `<div class="empty-wishlist">
          <div class="empty-wl-icon">📦</div>
          <div class="empty-wl-title">No orders yet</div>
          <div class="empty-wl-sub">Your completed orders will appear here.</div>
          <a href="index.html" class="btn-go-home">Browse Books</a>
        </div>`;
        return;
      }

      // Sync any auto-advanced statuses & credit gift points before rendering
      let ordersChanged = false;
      orders.forEach(o => {
        const live = computeOrderStatus(o);
        if (live !== o.status) {
          // If just flipped to Returned — credit refund as gift points once
          if (live === 'Returned' && !o.refundCredited) {
            const rawAmt  = String(o.total || '0').replace('₹', '').replace(',', '');
            const refund  = parseInt(rawAmt) || 0;
            const cur     = parseInt(localStorage.getItem('bw_gift_points') || '0');
            localStorage.setItem('bw_gift_points', String(cur + refund));
            o.refundCredited = true;
            o.refundAmount   = refund;
          }
          o.status = live;
          ordersChanged = true;
        }
      });
      if (ordersChanged) localStorage.setItem('bw_orders', JSON.stringify(orders));

      el.innerHTML = orders.map(o => {
        const items      = o.items || [];
        const liveStatus = o.status; // already synced above
        const sLow       = liveStatus.toLowerCase();
        const isCancelled = sLow === 'cancelled';
        const isRetReq    = sLow === 'return requested';
        const isReturned  = sLow === 'returned';
        const eligible    = isReturnEligible(o);

        // total — strip duplicate ₹
        const rawTotal = String(o.total || items.reduce((s,i) => s + (i.price||0), 0));
        const totalStr = rawTotal.startsWith('₹') ? rawTotal : '₹' + rawTotal;

        const coverHtml = it => {
          const bg     = it.coverBg || '#333';
          const genre  = (it.genre  || it.category || '').toUpperCase();
          const title  = it.title  || '';
          const author = it.author || '';
          return `<div class="oi-cover" style="background:${bg}">
            <div class="bk-cover-genre"  style="font-size:5px;color:rgba(255,255,255,.7);text-align:center;padding:1px 2px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis">${genre}</div>
            <div class="bk-cover-main-title" style="font-size:5px;font-weight:700;color:#fff;text-align:center;padding:0 2px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical">${title}</div>
            <div class="bk-cover-author-name" style="font-size:4px;color:rgba(255,255,255,.7);text-align:center;padding:1px 2px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis">${author}</div>
          </div>`;
        };

        let footerBtn = '';
        if (!isCancelled && !isRetReq && !isReturned) {
          const canCancel = !['delivered','return requested','returned'].includes(sLow);
          if (canCancel) {
            footerBtn = `<button class="order-cancel-btn" onclick="cancelOrder('${o.id}')">Cancel Order</button>`;
          } else if (eligible) {
            footerBtn = `<button class="order-return-btn" onclick="openReturnSheet('${o.id}')">↩ Return</button>`;
          }
        }

        let statusNote = '';
        if (isRetReq) {
          // Show countdown to auto-completion
          const reqAt   = o.returnRequestedAt;
          const doneAt  = reqAt ? reqAt + 2 * 60 * 1000 : null;
          const secsLeft = doneAt ? Math.max(0, Math.ceil((doneAt - Date.now()) / 1000)) : null;
          const eta     = secsLeft !== null
            ? (secsLeft > 0 ? `Processing — refund in ~${secsLeft < 60 ? secsLeft + 's' : Math.ceil(secsLeft/60) + 'min'}` : 'Completing…')
            : 'Processing your return';
          statusNote = `<div class="order-return-note">↩ Return requested on ${o.returnDate || 'recently'} · Reason: ${o.returnReason || ''}.<br><span style="color:#aaa">${eta} · ₹${rawTotal.replace('₹','')} will be credited as gift points.</span></div>`;
        } else if (isReturned) {
          const credited = o.refundAmount ? `₹${o.refundAmount}` : rawTotal;
          statusNote = `<div class="order-return-note" style="color:#9b59b6;background:rgba(155,89,182,.08)">✓ Returned on ${o.returnDate || 'recently'} · <strong>${credited} credited</strong> as gift points to your account.</div>`;
        }

        return `<div class="order-card">
          <div class="order-header">
            <div>
              <div class="order-id">Order #${o.id}</div>
              <div class="order-date">Placed ${o.date || 'Recently'}</div>
            </div>
            <span class="order-status ${statusClass(liveStatus)}">${liveStatus}</span>
          </div>
          <div class="order-items">
            ${items.map(it => `
              <div class="order-item" onclick="goBook(${it.id})">
                ${coverHtml(it)}
                <div class="oi-info">
                  <div class="oi-title">${it.title}</div>
                  <div class="oi-author">${it.author}</div>
                </div>
                <div class="oi-price">₹${it.price}</div>
              </div>
            `).join('')}
          </div>
          ${buildTracker(o, liveStatus)}
          <div class="order-footer">
            <div class="order-total-inline">
              <span class="order-total-label">Total paid</span>
              <span class="order-total-val">${totalStr}</span>
            </div>
            ${footerBtn}
          </div>
          ${statusNote}
        </div>`;
      }).join('');
    }

    function initOrders() {
      requireAuth();
      initNavbar();
      refreshBadge();
      // Build return reasons list
      const rl = document.getElementById('returnReasonsList');
      if (rl) {
        rl.innerHTML = RETURN_REASONS.map(r =>
          `<label class="return-reason-opt" onclick="selectReturnReason(this,'${r}')">
            <input type="radio" name="returnReason" value="${r}"/>
            ${r}
          </label>`
        ).join('');
      }
      renderOrdersList();
    }
    initOrders();
  </script>
</body>
</html>
