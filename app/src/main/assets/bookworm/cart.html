<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="theme-color" content="#0a0a0a"/>
  <title>Shopping Cart – Book Worm</title>
  <link rel="manifest" href="manifest.json"/>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

  <nav class="navbar">
    <div class="nav-brand-wrap">
      <div class="nav-grid-icon">
        <span></span><span></span><span></span>
        <span></span><span></span><span></span>
        <span></span><span></span><span></span>
      </div>
      <span class="nav-brand" onclick="window.location.href='index.html'">Book Worm</span>
    </div>
    <div class="nav-spacer"></div>
    <div class="nav-right-icons">
      <a href="cart.html" class="nav-icon-btn" title="Cart">
        🛒<span class="nav-badge" id="cartBadge" style="display:none">0</span>
      </a>
      <div class="user-dd-wrap">
        <button class="nav-profile-btn" onclick="toggleDD()" title="Profile">
          <span class="nav-avatar" id="navAvatar">U</span>
        </button>
        <div class="user-dd-menu" id="userMenu">
          <div class="user-dd-profile">
            <div class="udp-avatar" id="udpAvatar">U</div>
            <div class="udp-info">
              <div class="udp-name" id="uName">User</div>
              <div class="udp-email" id="uEmail"></div>
              <div id="udpPremBadge" style="display:none"></div>
            </div>
          </div>
          <div class="user-dd-links">
            <a href="dashboard.html">👤 My Profile</a>
            <a href="orders.html">📦 My Orders</a>
            <a href="wishlist.html">🤍 Wishlist</a>
            <a href="premium.html">👑 Premium</a>
            <a href="#" class="ud-signout" onclick="doLogout()">⎋ Sign Out</a>
          </div>
        </div>
      </div>
    </div>
  </nav>

  <div class="page-body cart-page">
    <div class="cart-page-title">Shopping Cart</div>
    <div class="cart-items" id="cartItems"></div>
    <div class="cart-summary" id="cartSummary"></div>
  </div>

  <nav class="bottom-nav">
    <a href="index.html"    class="bn-tab"><span class="bn-icon">🏠</span><span class="bn-label">Home</span></a>
    <a href="orders.html"   class="bn-tab"><span class="bn-icon">📦</span><span class="bn-label">Orders</span></a>
    <a href="wishlist.html" class="bn-tab"><span class="bn-icon">🤍</span><span class="bn-label">Wishlist</span></a>
    <a href="cart.html"     class="bn-tab active"><span class="bn-icon">🛒</span><span class="bn-label">Cart</span></a>
    <a href="premium.html"  class="bn-tab" id="premTab"><span class="bn-icon">👑</span><span class="bn-label">Premium</span></a>
  </nav>

  <!-- Address Edit Bottom Sheet -->
  <div class="return-sheet-overlay" id="addrSheetOverlay" onclick="closeAddrSheet()"></div>
  <div class="return-sheet" id="addrSheet" style="padding-bottom:40px">
    <div class="return-sheet-handle"></div>
    <div class="return-sheet-title">Delivery Address</div>
    <div class="return-sheet-sub" id="addrSheetSub">Enter your delivery address</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
      <div class="afield"><label>First Name</label><input type="text" id="addrFirst" placeholder="First Name" autocomplete="given-name"/></div>
      <div class="afield"><label>Last Name</label><input type="text" id="addrLast" placeholder="Last Name" autocomplete="family-name"/></div>
    </div>
    <div class="afield"><label>Street Address</label><input type="text" id="addrStreet" placeholder="Street address" autocomplete="street-address"/></div>
    <div class="afield"><label>Email</label><input type="email" id="addrEmail" placeholder="you@example.com" autocomplete="email"/></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
      <div class="afield"><label>City</label><input type="text" id="addrCity" placeholder="City" autocomplete="address-level2"/></div>
      <div class="afield"><label>Pin Code</label><input type="text" id="addrPin" placeholder="000000" inputmode="numeric"/></div>
    </div>
    <div class="afield">
      <label>Phone Number</label>
      <div class="phone-row">
        <select class="phone-code" id="addrCode"><option>+91</option><option>+1</option><option>+44</option></select>
        <input type="tel" id="addrPhone" placeholder="98765 43210" style="flex:1;min-width:0" autocomplete="tel"/>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
      <div class="afield"><label>State</label><input type="text" id="addrState" placeholder="State" autocomplete="address-level1"/></div>
      <div class="afield"><label>Country</label>
        <select id="addrCountry">
          <option value="India">India</option>
          <option value="USA">USA</option>
          <option value="UK">UK</option>
        </select>
      </div>
    </div>
    <button class="return-submit-btn" style="background:var(--orange)" onclick="saveAddrSheet()">Save Address</button>
  </div>

  <div id="toast"></div>
  <script src="data.js"></script>
  <script src="app.js"></script>
  <script>
    requireAuth();
    initNavbar();
    refreshBadge();

    // ── Address helpers ──────────────────────────────────
    function getSavedAddr() {
      return JSON.parse(localStorage.getItem('bw_addr') || 'null');
    }

    function addrOneLiner(a) {
      const parts = [a.street, a.city, a.state, a.pin].filter(Boolean);
      return parts.join(', ');
    }

    function openAddrSheet() {
      // Pre-fill fields with saved address if any
      const saved = getSavedAddr();
      if (saved) {
        ['first','last','street','city','pin','state','email','phone'].forEach(k => {
          const el = document.getElementById('addr' + k.charAt(0).toUpperCase() + k.slice(1));
          if (el) el.value = saved[k] || '';
        });
        document.getElementById('addrSheetSub').textContent = 'Update your delivery address';
      } else {
        // Pre-fill email from logged-in user
        const u = getUser();
        if (u) {
          const eEl = document.getElementById('addrEmail');
          if (eEl && !eEl.value) eEl.value = u.email || '';
          const nEl = document.getElementById('addrFirst');
          if (nEl && !nEl.value) nEl.value = (u.name || '').split(' ')[0] || '';
          const lEl = document.getElementById('addrLast');
          if (lEl && !lEl.value) lEl.value = (u.name || '').split(' ').slice(1).join(' ') || '';
        }
        document.getElementById('addrSheetSub').textContent = 'Enter your delivery address';
      }
      document.getElementById('addrSheetOverlay').classList.add('open');
      document.getElementById('addrSheet').classList.add('open');
    }

    function closeAddrSheet() {
      document.getElementById('addrSheetOverlay').classList.remove('open');
      document.getElementById('addrSheet').classList.remove('open');
    }

    function saveAddrSheet() {
      const first  = document.getElementById('addrFirst').value.trim();
      const street = document.getElementById('addrStreet').value.trim();
      const city   = document.getElementById('addrCity').value.trim();
      if (!first || !street || !city) { showToast('Please fill First Name, Street & City'); return; }
      const addr = {
        first, last:    document.getElementById('addrLast').value.trim(),
        street, city,
        pin:     document.getElementById('addrPin').value.trim(),
        state:   document.getElementById('addrState').value.trim(),
        country: document.getElementById('addrCountry').value,
        email:   document.getElementById('addrEmail').value.trim(),
        phone:   document.getElementById('addrPhone').value.trim()
      };
      localStorage.setItem('bw_addr', JSON.stringify(addr));
      closeAddrSheet();
      showToast('Address saved ✓');
      renderCart();
    }

    // ── Cart rendering ───────────────────────────────────
    function renderCart() {
      const cart  = getCart();
      const items = document.getElementById('cartItems');
      const sumEl = document.getElementById('cartSummary');

      if (cart.length === 0) {
        items.innerHTML = `<div class="empty-cart">
          <div style="font-size:48px;margin-bottom:16px">🛒</div>
          <div style="font-size:16px;font-weight:600;color:#fff;margin-bottom:8px">Your cart is empty</div>
          <div style="margin-bottom:18px">Add books to your cart to checkout.</div>
          <a href="index.html" class="btn-go-home">Browse Books</a>
        </div>`;
        sumEl.innerHTML = '';
        return;
      }

      const cartBooks = cart.map(c => {
        const b = getAllBooks().find(b => b.id === c.id);
        return b ? { ...b, qty: c.qty } : null;
      }).filter(Boolean);

      const prem     = isPremium();
      const totalQty = cartBooks.reduce((s, b) => s + b.qty, 0);
      const subtotal = cartBooks.reduce((s, b) => s + b.price * b.qty, 0);
      const tax      = Math.round(subtotal * 0.12);
      const discount = Math.round(subtotal * 0.05);
      const giftPts  = parseInt(localStorage.getItem('bw_gift_points') || '0');

      // Delivery fee — resolves 'standard' sentinel using actual subtotal
      const delivFee = resolvedDelivFee(prem, subtotal);
      const total    = subtotal + tax - discount + delivFee;

      // ── Cart items with 3-zone covers ──
      items.innerHTML = cartBooks.map(b => {
        const genre  = (b.genre || b.category || '').toUpperCase();
        return `<div class="cart-item">
          <div class="ci-cover" style="background:${b.coverBg}">
            <div class="ci-cover-genre">${genre}</div>
            <div class="ci-cover-main-title">${b.title}</div>
            <div class="ci-cover-author-name">${b.author}</div>
          </div>
          <div class="ci-info">
            <div class="ci-title" onclick="goBook(${b.id})">${b.title}</div>
            <div class="ci-author">by <a href="book.html?id=${b.id}">${b.author}</a></div>
            <div class="ci-desc">${b.desc}</div>
            <div class="ci-format">${b.format}</div>
            <div class="ci-price">₹${b.price}</div>
            <div class="ci-delivery">Delivery by <strong>${b.delivery}</strong></div>
            <div class="ci-qty">
              <button class="qty-btn" onclick="changeQty(${b.id},-1)">−</button>
              <span class="qty-val" id="qty-${b.id}">${b.qty}</span>
              <button class="qty-btn" onclick="changeQty(${b.id},1)">+</button>
            </div>
            <button class="ci-remove" onclick="removeItem(${b.id})">Remove</button>
          </div>
        </div>`;
      }).join('');

      // ── "You might also like" — books related to cart items ──
      const cartIds   = new Set(cartBooks.map(b => b.id));
      const cartCats  = new Set(cartBooks.flatMap(b => [b.category, ...(b.genres || [])]));
      const allBooks  = getAllBooks();
      const suggested = allBooks
        .filter(b => !cartIds.has(b.id) && (cartCats.has(b.category) || (b.genres||[]).some(g => cartCats.has(g))))
        .slice(0, 6);
      // fallback: if fewer than 3 matches, pad with random books
      const fallback  = allBooks.filter(b => !cartIds.has(b.id) && !suggested.find(s => s.id === b.id));
      const recs      = [...suggested, ...fallback].slice(0, 6);

      const recsHtml = recs.length ? `
        <div class="cart-recs-section">
          <div class="cart-recs-title">You might also like</div>
          <div class="cart-recs-list">
            ${recs.map(r => `
              <div class="cart-rec-card" onclick="window.location.href='book.html?id=${r.id}'">
                <div class="cart-rec-cover" style="background:${r.coverBg}">
                  <div class="cart-rec-genre">${(r.genre||r.category||'').toUpperCase()}</div>
                  <div class="cart-rec-title">${r.title}</div>
                  <div class="cart-rec-author">${r.author}</div>
                </div>
                <div class="cart-rec-info">
                  <div class="cart-rec-name">${r.title}</div>
                  <div class="cart-rec-by">by ${r.author}</div>
                  <div class="cart-rec-price">₹${r.price}</div>
                  <button class="cart-rec-add" onclick="event.stopPropagation();addToCart(${r.id});renderCart()">+ Cart</button>
                </div>
              </div>`).join('')}
          </div>
        </div>` : '';

      items.innerHTML += recsHtml;

      // ── Delivery address block ──
      const saved = getSavedAddr();
      let addrBlock;
      if (saved) {
        addrBlock = `
          <div class="addr-card">
            <div class="addr-card-header">
              <h3>📍 Delivery Address</h3>
              <button class="addr-edit-btn" onclick="openAddrSheet()">✏️ Change</button>
            </div>
            <div class="addr-default-badge">✓ Default Address</div>
            <div class="addr-saved-display">
              <div class="asd-name">${saved.first} ${saved.last || ''}</div>
              <div class="asd-line">${addrOneLiner(saved)}</div>
              ${saved.country ? `<div class="asd-line">${saved.country}</div>` : ''}
              ${saved.phone   ? `<div class="asd-line">📞 ${saved.phone}</div>` : ''}
              ${saved.email   ? `<div class="asd-line">✉️ ${saved.email}</div>` : ''}
            </div>
          </div>`;
      } else {
        addrBlock = `
          <div class="addr-card">
            <div class="addr-card-header">
              <h3>📍 Delivery Address</h3>
            </div>
            <div style="text-align:center;padding:16px 0 8px;color:#888;font-size:13px">No address saved yet</div>
            <button class="addr-save-btn" onclick="openAddrSheet()">+ Add Delivery Address</button>
          </div>`;
      }

      // ── Delivery options HTML ──
      const delivOptHtml = buildDelivOpts(prem, subtotal);

      // ── Premium banner ──
      const premBanner = prem
        ? `<div class="cart-prem-badge">👑 Premium member · Express delivery included free</div>` : '';

      // ── Coupon section ──
      const premCoupons = prem
        ? `<div style="margin-bottom:8px;font-size:11px;color:#f5c842">👑 Premium coupons: <b>PREM200</b> (₹200) · <b>PREM500</b> (₹500)</div>` : '';

      sumEl.innerHTML = `
        ${addrBlock}
        ${delivOptHtml}
        <div class="gt-card">
          <div class="gt-inner">
            ${premBanner}
            <div class="gt-content">
              <h3>Order Summary</h3>
              <div class="gt-row"><span>Price (${totalQty} item${totalQty > 1 ? 's' : ''})</span><span class="gt-val-right">₹${subtotal}</span></div>
              <div class="gt-row"><span>Tax (12%)</span><span class="gt-val-right">₹${tax}</span></div>
              <div class="gt-row"><span>Discount (5%)</span><span class="gt-free">−₹${discount}</span></div>
              <div class="gt-row" id="delivRow"><span>Delivery</span><span id="delivAmt" class="${delivFee === 0 ? 'gt-free' : 'gt-val-right'}">${delivFee === 0 ? 'Free' : '₹' + delivFee}</span></div>
              <div class="coupon-row">
                ${premCoupons}
                <input type="text" id="couponInput" placeholder="Coupon code"/>
                <button class="coupon-apply" onclick="applyCoupon()">Apply</button>
              </div>
              <div class="gt-row" id="couponDiscount" style="display:none"><span>Coupon Discount</span><span class="gt-free" id="couponAmt">₹0</span></div>
              ${giftPts > 0 ? `
              <div class="gt-row"><span>Gift Points (${giftPts} pts)</span><span class="gt-free" id="giftDiscount">₹0</span></div>
              <button class="coupon-apply" style="width:100%;border-radius:8px;margin-bottom:8px" onclick="redeemGift()">Redeem ${giftPts} Gift Points</button>` : ''}
              <div class="gt-row total"><span>Total Amount</span><span class="gt-val-right" id="totalAmt">₹${total}</span></div>
              <button class="pay-btn" onclick="proceedPay()">Pay Now →</button>
            </div>
          </div>
        </div>`;
    }

    // ── Delivery option state ─────────────────────────────
    // Tracks which option the user picked; persists across re-renders
    let _selDelivery = localStorage.getItem('bw_sel_delivery') || 'standard';

    const DELIVERY_OPTS = {
      // normal users
      standard: { label: 'Standard Delivery',  desc: '4–6 business days',      fee: null,  badge: null,   days: 6  },
      fast:     { label: 'Fast Delivery',       desc: '2–3 business days',      fee: 79,    badge: 'fast', days: 3  },
      sameday:  { label: 'Same-Day Delivery',   desc: 'Delivered by tonight',   fee: 149,   badge: 'same', days: 0  },
      // premium users (free)
      prem_same:{ label: 'Same-Day Delivery',   desc: 'Delivered by tonight',   fee: 0,     badge: 'prem', days: 0  },
      prem_next:{ label: 'Next-Day Delivery',   desc: 'Delivered tomorrow',     fee: 0,     badge: 'prem', days: 1  },
    };

    function calcDelivFee(prem) {
      if (prem) return 0;   // all premium options are free
      const opt = DELIVERY_OPTS[_selDelivery];
      if (!opt) return 40;
      // standard: free over ₹400 else ₹40
      if (_selDelivery === 'standard') {
        // we don't have subtotal here; caller adjusts — return sentinel -1 meaning "use subtotal rule"
        return -1;
      }
      return opt.fee || 0;
    }

    // Returns actual fee given subtotal (resolves standard sentinel)
    function resolvedDelivFee(prem, subtotal) {
      const raw = calcDelivFee(prem);
      if (raw === -1) return subtotal > 400 ? 0 : 40;
      return raw;
    }

    function buildDelivOpts(prem, subtotal) {
      // default selection for premium
      if (prem && (_selDelivery === 'standard' || _selDelivery === 'fast' || _selDelivery === 'sameday')) {
        _selDelivery = 'prem_same';
        localStorage.setItem('bw_sel_delivery', _selDelivery);
      }
      if (!prem && (_selDelivery === 'prem_same' || _selDelivery === 'prem_next')) {
        _selDelivery = 'standard';
        localStorage.setItem('bw_sel_delivery', _selDelivery);
      }

      const opts = prem
        ? [
            { key: 'prem_same', ...DELIVERY_OPTS['prem_same'] },
            { key: 'prem_next', ...DELIVERY_OPTS['prem_next'] },
          ]
        : [
            { key: 'standard', ...DELIVERY_OPTS['standard'],
              feeDisplay: subtotal > 400 ? 'Free' : '₹40' },
            { key: 'fast',    ...DELIVERY_OPTS['fast'] },
            { key: 'sameday', ...DELIVERY_OPTS['sameday'] },
          ];

      const rows = opts.map(o => {
        const isSel     = o.key === _selDelivery;
        const selClass  = prem ? (isSel ? 'selected-prem' : '') : (isSel ? 'selected' : '');
        const feeLabel  = o.fee === 0 ? '<span class="dopt-price free">Free</span>'
                        : o.feeDisplay ? `<span class="dopt-price ${o.feeDisplay === 'Free' ? 'free' : 'paid'}">${o.feeDisplay}</span>`
                        : `<span class="dopt-price paid">+₹${o.fee}</span>`;
        const badge     = o.badge
          ? `<span class="dopt-badge ${o.badge}">${o.badge === 'prem' ? '👑 Perk' : o.badge === 'fast' ? '⚡ Fast' : '🟢 Express'}</span>`
          : '';
        return `<label class="dopt ${selClass}" onclick="selectDelivery('${o.key}',${prem})">
          <input type="radio" name="delivOpt" value="${o.key}" ${isSel ? 'checked' : ''}/>
          <div class="dopt-radio"></div>
          <div class="dopt-body">
            <div class="dopt-label">${o.label} ${badge}</div>
            <div class="dopt-desc">${o.desc}</div>
          </div>
          ${feeLabel}
        </label>`;
      }).join('');

      const heading = prem
        ? `<div class="dopt-title">🚚 Delivery Speed <span style="font-size:11px;color:#f5c842;font-weight:600">👑 All free for Premium</span></div>`
        : `<div class="dopt-title">🚚 Delivery Speed</div>`;

      return `<div class="addr-card dopt-section">${heading}<div class="dopt-list">${rows}</div></div>`;
    }

    function selectDelivery(key, prem) {
      _selDelivery = key;
      localStorage.setItem('bw_sel_delivery', key);
      // Update visual selection
      document.querySelectorAll('.dopt').forEach(el => {
        el.classList.remove('selected', 'selected-prem');
        if (el.querySelector(`input[value="${key}"]`)) {
          el.classList.add(prem ? 'selected-prem' : 'selected');
        }
      });
      // Recompute delivery row in summary without full re-render
      const cart      = getCart();
      const cartBooks = cart.map(c => { const b = getAllBooks().find(x => x.id === c.id); return b ? {...b, qty:c.qty} : null; }).filter(Boolean);
      const subtotal  = cartBooks.reduce((s,b) => s + b.price*b.qty, 0);
      const tax       = Math.round(subtotal * 0.12);
      const discount  = Math.round(subtotal * 0.05);
      const fee       = resolvedDelivFee(prem, subtotal);
      const baseTotal = subtotal + tax - discount + fee;

      const delivAmtEl = document.getElementById('delivAmt');
      if (delivAmtEl) {
        delivAmtEl.textContent = fee === 0 ? 'Free' : '₹' + fee;
        delivAmtEl.className   = fee === 0 ? 'gt-free' : 'gt-val-right';
      }
      // Adjust total: strip coupon/gift already applied and rebase
      // Simplest: re-render full summary to keep totals consistent
      renderCart();
    }

    // ── Cart actions ─────────────────────────────────────
    function changeQty(id, delta) {
      let cart = getCart();
      const item = cart.find(c => c.id === id);
      if (!item) return;
      const newQty = item.qty + delta;
      if (newQty < 1) {
        cart = cart.filter(c => c.id !== id);
        saveCart(cart);
        showToast('Item removed');
      } else {
        item.qty = newQty;
        saveCart(cart);
      }
      renderCart();
    }

    function removeItem(id) {
      saveCart(getCart().filter(c => c.id !== id));
      renderCart();
      showToast('Item removed from cart');
    }

    function applyCoupon() {
      const code = document.getElementById('couponInput').value.trim().toUpperCase();
      const row  = document.getElementById('couponDiscount');
      const amt  = document.getElementById('couponAmt');
      const tot  = document.getElementById('totalAmt');
      const prem = isPremium();
      const discounts = prem
        ? { 'BOOK50': 50, 'BOOK100': 100, 'SAVE20': 20, 'PREM200': 200, 'PREM500': 500, 'WELCOME50': 50 }
        : { 'BOOK50': 50, 'BOOK100': 100, 'SAVE20': 20 };
      if (discounts[code]) {
        const off = discounts[code];
        row.style.display = 'flex';
        amt.textContent = '₹' + off;
        tot.textContent = '₹' + Math.max(0, parseInt(tot.textContent.replace('₹', '')) - off);
        showToast(`Coupon ${code} applied! ₹${off} off ✓`);
      } else {
        showToast('Invalid coupon code');
      }
    }

    function redeemGift() {
      const pts  = parseInt(localStorage.getItem('bw_gift_points') || '0');
      const disc = pts;
      const gd   = document.getElementById('giftDiscount');
      const tot  = document.getElementById('totalAmt');
      if (gd) gd.textContent = '₹' + disc;
      if (tot) tot.textContent = '₹' + Math.max(0, parseInt(tot.textContent.replace('₹', '')) - disc);
      localStorage.setItem('bw_gift_points', '0');
      showToast('Gift points redeemed! ₹' + disc + ' off ✓');
    }

    function proceedPay() {
      const saved = getSavedAddr();
      if (!saved || !saved.first || !saved.street || !saved.city) {
        showToast('Please add a delivery address first');
        openAddrSheet();
        return;
      }
      // Persist selected delivery type so completePayment() can read it
      localStorage.setItem('bw_checkout_delivery', _selDelivery);
      localStorage.setItem('bw_checkout_total', document.getElementById('totalAmt').textContent);
      window.location.href = 'payment.html';
    }

    renderCart();
  </script>
</body>
</html>
