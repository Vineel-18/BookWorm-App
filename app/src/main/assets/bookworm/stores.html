<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="theme-color" content="#0a0a0a"/>
  <title>Book Worm – Stores</title>
  <link rel="manifest" href="manifest.json"/>
  <link rel="stylesheet" href="style.css"/>
  <style>
    /* Store list */
    .store-card {
      border-radius: 16px; overflow: hidden;
      margin-bottom: 14px; cursor: pointer;
      border: 1px solid var(--border);
    }
    .store-card-header {
      padding: 22px 18px 18px;
      display: flex; align-items: flex-start; gap: 14px;
    }
    .store-emoji { font-size: 36px; flex-shrink: 0; line-height: 1; }
    .store-name    { font-size: 18px; font-weight: 800; color: #fff; }
    .store-tagline { font-size: 12px; color: rgba(255,255,255,.6); margin-top: 3px; }
    .store-meta    { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
    .store-meta-chip {
      font-size: 10px; font-weight: 600;
      padding: 3px 9px; border-radius: 20px;
      background: rgba(255,255,255,.1); color: rgba(255,255,255,.8);
    }
    .store-stats {
      display: flex; gap: 16px; padding: 12px 18px;
      background: rgba(0,0,0,.25); border-top: 1px solid rgba(255,255,255,.08);
    }
    .store-stat-val { font-size: 15px; font-weight: 800; color: #fff; }
    .store-stat-lbl { font-size: 9px; color: rgba(255,255,255,.5); text-transform: uppercase; letter-spacing: .6px; margin-top: 1px; }
    .store-enter-btn {
      margin-left: auto; align-self: center;
      background: rgba(255,255,255,.15); color: #fff;
      border: none; font-size: 12px; font-weight: 700;
      padding: 7px 14px; border-radius: 20px; cursor: pointer;
      flex-shrink: 0;
    }

    /* Detail view */
    .store-detail-hero {
      padding: 24px 16px 20px;
      border-bottom: 1px solid var(--border);
    }
    .store-detail-emoji { font-size: 48px; margin-bottom: 10px; }
    .store-detail-name { font-size: 22px; font-weight: 900; color: #fff; }
    .store-detail-tagline { font-size: 13px; color: #888; margin-top: 4px; }
    .store-detail-desc { font-size: 13px; color: #aaa; margin-top: 12px; line-height: 1.6; }
    .store-detail-chips { display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap; }
    .store-detail-chip {
      font-size: 11px; font-weight: 600; padding: 4px 11px;
      border-radius: 20px; border: 1px solid var(--border); color: #aaa;
      background: var(--surface);
    }

    .store-detail-stats {
      display: grid; grid-template-columns: 1fr 1fr 1fr;
      gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--border);
    }
    .sds-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 10px; padding: 12px 10px; text-align: center;
    }
    .sds-val { font-size: 18px; font-weight: 900; color: #fff; }
    .sds-lbl { font-size: 9px; color: #555; text-transform: uppercase; letter-spacing: .6px; margin-top: 3px; }

    /* Catalog sections */
    .catalog-section { padding: 14px 16px 4px; }
    .catalog-section-title {
      font-size: 11px; font-weight: 700; color: #555;
      text-transform: uppercase; letter-spacing: .8px; margin-bottom: 10px;
    }
    .catalog-book-row { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 8px; }
    .catalog-book-row::-webkit-scrollbar { height: 0; }
    .cat-book-card { flex-shrink: 0; width: 90px; cursor: pointer; }
    .cat-book-cover {
      width: 90px; height: 126px; border-radius: 8px;
      display: flex; flex-direction: column; justify-content: space-between;
      padding: 7px; margin-bottom: 6px;
    }
    .cat-book-genre  { font-size: 6px; color: rgba(255,255,255,.7); text-transform: uppercase; letter-spacing: .5px; }
    .cat-book-title  { font-size: 9px; font-weight: 900; color: #fff; text-align: center; line-height: 1.2; flex: 1; display: flex; align-items: center; justify-content: center; word-break: break-word; padding: 2px 0; }
    .cat-book-author { font-size: 6px; color: rgba(255,255,255,.7); text-align: center; text-transform: uppercase; }
    .cat-book-name   { font-size: 11px; font-weight: 600; color: #fff; line-height: 1.3; }
    .cat-book-price  { font-size: 11px; color: var(--orange); font-weight: 700; margin-top: 2px; }

    /* Policy */
    .policy-section { padding: 14px 16px; }
    .policy-title { font-size: 16px; font-weight: 800; color: #fff; margin-bottom: 14px; }
    .policy-item {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 14px; margin-bottom: 10px;
      display: flex; gap: 12px; align-items: flex-start;
    }
    .policy-icon { font-size: 20px; flex-shrink: 0; }
    .policy-label { font-size: 11px; font-weight: 700; color: #888; text-transform: uppercase; letter-spacing: .6px; margin-bottom: 4px; }
    .policy-text  { font-size: 13px; color: #ccc; line-height: 1.5; }

    /* Back button */
    .back-btn {
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--surface); border: 1px solid var(--border);
      color: #aaa; font-size: 13px; padding: 8px 14px;
      border-radius: 10px; cursor: pointer; margin: 14px 16px 0;
    }

    /* Tab bar inside detail */
    .store-tabs {
      display: flex; border-bottom: 1px solid var(--border);
      position: sticky; top: 52px; background: var(--bg); z-index: 10;
    }
    .store-tab {
      flex: 1; padding: 12px 0; text-align: center;
      font-size: 12px; font-weight: 600; color: #666;
      border-bottom: 2px solid transparent; cursor: pointer;
    }
    .store-tab.active { color: var(--orange); border-bottom-color: var(--orange); }
    .store-tab-panel { display: none; }
    .store-tab-panel.active { display: block; }
  </style>
</head>
<body>

  <nav class="navbar">
    <div class="nav-brand-wrap">
      <div class="nav-grid-icon"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
      <span class="nav-brand" onclick="window.location.href='index.html'">Book Worm</span>
    </div>
    <div class="nav-spacer"></div>
    <div class="nav-right-icons">
      <a href="cart.html" class="nav-icon-btn" title="Cart">
        🛒<span class="nav-badge" id="cartBadge" style="display:none">0</span>
      </a>
      <div class="user-dd-wrap">
        <button class="nav-profile-btn" onclick="toggleDD()" title="Profile">
          <span class="nav-avatar" id="navAvatar">U</span>
        </button>
        <div class="user-dd-menu" id="userMenu">
          <div class="user-dd-profile">
            <div class="udp-avatar" id="udpAvatar">U</div>
            <div class="udp-info">
              <div class="udp-name" id="uName">User</div>
              <div class="udp-email" id="uEmail"></div>
              <div id="udpPremBadge" style="display:none"></div>
            </div>
          </div>
          <div class="user-dd-links">
            <a href="dashboard.html">👤 My Dashboard</a>
            <a href="orders.html">📦 My Orders</a>
            <a href="wishlist.html">🤍 Wishlist</a>
            <a href="premium.html">👑 Premium</a>
            <a href="#" class="ud-signout" onclick="doLogout()">⎋ Sign Out</a>
          </div>
        </div>
      </div>
    </div>
  </nav>

  <div class="page-body" style="padding-bottom: calc(var(--bottom-h) + 16px + var(--safe-bottom))">

    <!-- ── STORE LIST VIEW ── -->
    <div id="storeListView">
      <div style="padding: 16px 16px 4px">
        <div style="font-size:20px;font-weight:800;color:#fff">Our Stores</div>
        <div style="font-size:12px;color:#555;margin-top:4px">45 books across 3 curated stores</div>
      </div>
      <div style="padding: 12px 16px 0" id="storeListContainer"></div>
    </div>

    <!-- ── STORE DETAIL VIEW ── -->
    <div id="storeDetailView" style="display:none">
      <button class="back-btn" onclick="showList()">← Back to Stores</button>
      <div id="storeDetailContent"></div>
    </div>

  </div>

  <nav class="bottom-nav">
    <a href="index.html"    class="bn-tab"><span class="bn-icon">🏠</span><span class="bn-label">Home</span></a>
    <a href="orders.html"   class="bn-tab"><span class="bn-icon">📦</span><span class="bn-label">Orders</span></a>
    <a href="wishlist.html" class="bn-tab"><span class="bn-icon">🤍</span><span class="bn-label">Wishlist</span></a>
    <a href="cart.html"     class="bn-tab"><span class="bn-icon">🛒</span><span class="bn-label">Cart</span></a>
    <a href="premium.html"  class="bn-tab" id="premTab"><span class="bn-icon">👑</span><span class="bn-label">Premium</span></a>
  </nav>

  <div id="toast"></div>
  <script src="data.js"></script>
  <script src="app.js"></script>
  <script>
    requireAuth();
    initNavbar();

    // ── Render store list ─────────────────────────
    function renderStoreList() {
      document.getElementById('storeListContainer').innerHTML = STORES.map(s => {
        const books = BOOKS.filter(b => s.bookIds.includes(b.id));
        const totalSales = books.reduce((sum, b) => sum + (b.sales || 0), 0);
        return `<div class="store-card" style="background:${s.coverColor}" onclick="openStore('${s.id}')">
          <div class="store-card-header">
            <div class="store-emoji">${s.emoji}</div>
            <div style="flex:1;min-width:0">
              <div class="store-name">${s.name}</div>
              <div class="store-tagline">${s.tagline}</div>
              <div class="store-meta">
                ${s.categories.slice(0,3).map(c => `<span class="store-meta-chip">${c}</span>`).join('')}
                ${s.categories.length > 3 ? `<span class="store-meta-chip">+${s.categories.length-3} more</span>` : ''}
              </div>
            </div>
            <button class="store-enter-btn">Enter →</button>
          </div>
          <div class="store-stats">
            <div><div class="store-stat-val">${s.bookIds.length}</div><div class="store-stat-lbl">Books</div></div>
            <div><div class="store-stat-val">⭐ ${s.rating}</div><div class="store-stat-lbl">Rating</div></div>
            <div><div class="store-stat-val">${(totalSales/1000).toFixed(1)}K</div><div class="store-stat-lbl">Sales</div></div>
            <div><div class="store-stat-val">${s.location.split(',')[0]}</div><div class="store-stat-lbl">Location</div></div>
          </div>
        </div>`;
      }).join('');
    }

    // ── Open store detail ─────────────────────────
    function openStore(id) {
      const s = STORES.find(x => x.id === id);
      if (!s) return;
      const books = BOOKS.filter(b => s.bookIds.includes(b.id));
      const totalSales = books.reduce((sum, b) => sum + (b.sales || 0), 0);

      // Build catalog HTML
      const catalogHtml = s.catalog.map(sec => {
        const secBooks = BOOKS.filter(b => sec.ids.includes(b.id));
        return `<div class="catalog-section">
          <div class="catalog-section-title">${sec.section}</div>
          <div class="catalog-book-row">
            ${secBooks.map(b => `
              <div class="cat-book-card" onclick="goBook(${b.id})">
                <div class="cat-book-cover" style="background:${b.coverBg}">
                  <div class="cat-book-genre">${b.category}</div>
                  <div class="cat-book-title">${b.coverText || b.title}</div>
                  <div class="cat-book-author">${b.coverAuthorDisplay || b.author}</div>
                </div>
                <div class="cat-book-name">${b.title}</div>
                <div class="cat-book-price">₹${b.price}</div>
              </div>`).join('')}
          </div>
        </div>`;
      }).join('');

      // Build policy HTML
      const policyItems = [
        { icon: '↩️', label: 'Returns',  text: s.policy.returns  },
        { icon: '🚚', label: 'Delivery', text: s.policy.delivery },
        { icon: '💳', label: 'Payment',  text: s.policy.payment  },
        { icon: '🛡️', label: 'Warranty', text: s.policy.warranty },
        { icon: '🎁', label: 'Loyalty',  text: s.policy.loyalty  },
        { icon: '📞', label: 'Contact',  text: s.policy.contact  },
      ];
      const policyHtml = `<div class="policy-section">
        <div class="policy-title">Store Policies</div>
        ${policyItems.map(p => `
          <div class="policy-item">
            <div class="policy-icon">${p.icon}</div>
            <div><div class="policy-label">${p.label}</div><div class="policy-text">${p.text}</div></div>
          </div>`).join('')}
      </div>`;

      document.getElementById('storeDetailContent').innerHTML = `
        <div class="store-detail-hero" style="background:${s.coverColor}">
          <div class="store-detail-emoji">${s.emoji}</div>
          <div class="store-detail-name">${s.name}</div>
          <div class="store-detail-tagline">${s.tagline}</div>
          <div class="store-detail-desc">${s.description}</div>
          <div class="store-detail-chips">
            ${s.categories.map(c => `<span class="store-detail-chip">${c}</span>`).join('')}
          </div>
        </div>

        <div class="store-detail-stats">
          <div class="sds-card"><div class="sds-val">${s.bookIds.length}</div><div class="sds-lbl">Books</div></div>
          <div class="sds-card"><div class="sds-val">⭐ ${s.rating}</div><div class="sds-lbl">Rating</div></div>
          <div class="sds-card"><div class="sds-val">${(totalSales/1000).toFixed(1)}K</div><div class="sds-lbl">Sold</div></div>
        </div>

        <div class="store-tabs">
          <div class="store-tab active" onclick="switchTab('catalog',this)">📋 Catalogue</div>
          <div class="store-tab" onclick="switchTab('policy',this)">📜 Policies</div>
          <div class="store-tab" onclick="switchTab('about',this)">ℹ️ About</div>
        </div>

        <div class="store-tab-panel active" id="tab-catalog">${catalogHtml}</div>

        <div class="store-tab-panel" id="tab-policy">${policyHtml}</div>

        <div class="store-tab-panel" id="tab-about">
          <div style="padding:16px">
            <div style="background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden">
              ${[
                ['📍', 'Location', s.location],
                ['📅', 'Founded', s.founded],
                ['📚', 'Total Books', s.bookIds.length + ' titles'],
                ['🏷️', 'Specialises In', s.categories.join(', ')],
                ['⭐', 'Store Rating', s.rating + ' / 5'],
                ['📦', 'Total Sales', (s.totalSales).toLocaleString() + ' copies sold'],
              ].map(([icon, lbl, val]) => `
                <div style="display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--border)">
                  <span style="font-size:18px;flex-shrink:0">${icon}</span>
                  <span style="font-size:12px;color:#666;width:100px;flex-shrink:0">${lbl}</span>
                  <span style="font-size:13px;color:#fff;flex:1">${val}</span>
                </div>`).join('')}
            </div>
          </div>
        </div>
      `;

      document.getElementById('storeListView').style.display = 'none';
      document.getElementById('storeDetailView').style.display = 'block';
      window.scrollTo(0, 0);
    }

    function showList() {
      document.getElementById('storeDetailView').style.display = 'none';
      document.getElementById('storeListView').style.display = 'block';
    }

    function switchTab(id, el) {
      document.querySelectorAll('.store-tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.store-tab-panel').forEach(p => p.classList.remove('active'));
      el.classList.add('active');
      document.getElementById('tab-' + id).classList.add('active');
    }

    renderStoreList();
  </script>
</body>
</html>
