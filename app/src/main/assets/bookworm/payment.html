<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="theme-color" content="#0a0a0a"/>
  <title>Book Worm – Payment</title>
  <link rel="manifest" href="manifest.json"/>
  <link rel="stylesheet" href="style.css"/>
</head>
<body class="payment-page">

  <nav class="navbar">
    <div class="nav-brand-wrap">
      <div class="nav-grid-icon">
        <span></span><span></span><span></span>
        <span></span><span></span><span></span>
        <span></span><span></span><span></span>
      </div>
      <span class="nav-brand" onclick="window.location.href='index.html'">Book Worm</span>
    </div>
    <div class="nav-spacer"></div>
    <div class="nav-right-icons">
      <a href="cart.html" class="nav-icon-btn" title="Cart">
        🛒<span class="nav-badge" id="cartBadge" style="display:none">0</span>
      </a>
      <div class="user-dd-wrap">
        <button class="nav-profile-btn" onclick="toggleDD()" title="Profile">
          <span class="nav-avatar" id="navAvatar">U</span>
        </button>
        <div class="user-dd-menu" id="userMenu">
          <div class="user-dd-profile">
            <div class="udp-avatar" id="udpAvatar">U</div>
            <div class="udp-info">
              <div class="udp-name" id="uName">User</div>
              <div class="udp-email" id="uEmail"></div>
              <div id="udpPremBadge" style="display:none"></div>
            </div>
          </div>
          <div class="user-dd-links">
            <a href="orders.html">📦 My Orders</a>
            <a href="wishlist.html">🤍 Wishlist</a>
            <a href="premium.html">👑 Premium</a>
            <a href="#" class="ud-signout" onclick="doLogout()">⎋ Sign Out</a>
          </div>
        </div>
      </div>
    </div>
  </nav>

  <div class="payment-bg">
    <div class="float-book book-1">📗</div>
    <div class="float-book book-2">📘</div>
    <div class="float-book book-3">📙</div>
    <div class="float-book book-4">📕</div>
    <div class="float-book book-5">📚</div>
    <div class="float-book book-6">📖</div>
    <div class="shape-diamond d1">◆</div>
    <div class="shape-diamond d2">◆</div>
    <div class="shape-circle c1"></div>
    <div class="shape-circle c2"></div>
  </div>

  <div class="page-body">
    <div class="payment-modal-wrapper">
      <div class="payment-modal">
        <div class="payment-modal-header">
          <h3>Complete Payment</h3>
          <span class="payable-label">Amount: <strong id="payableAmount">₹0</strong></span>
        </div>

        <div class="payment-methods">
          <div class="payment-method-option active" data-method="credit"><span class="method-radio"></span> Credit Card</div>
          <div class="payment-method-option" data-method="debit"><span class="method-radio"></span> Debit Card</div>
          <div class="payment-method-option" data-method="upi"><span class="method-radio"></span> UPI</div>
          <div class="payment-method-option" data-method="wallet"><span class="method-radio"></span> Wallet</div>
        </div>

        <div class="method-fields active" id="fields-credit">
          <div class="form-row">
            <div class="form-group"><label>Card Number</label><input type="text" inputmode="numeric" maxlength="19" placeholder="0000-0000-0000-0000" id="cardNumber" oninput="formatCard(this)"/></div>
            <div class="form-group"><label>Name on Card</label><input type="text" placeholder="Your Name" id="cardName" autocomplete="cc-name"/></div>
          </div>
          <div class="form-row">
            <div class="form-group"><label>CVV</label><input type="password" maxlength="3" placeholder="•••" id="cvv" autocomplete="cc-csc"/></div>
            <div class="form-group"><label>Expiry</label><input type="text" placeholder="MM/YYYY" id="expiry" oninput="formatExpiry(this)" autocomplete="cc-exp"/></div>
          </div>
        </div>

        <div class="method-fields" id="fields-debit">
          <div class="form-row">
            <div class="form-group"><label>Card Number</label><input type="text" inputmode="numeric" maxlength="19" placeholder="0000-0000-0000-0000" oninput="formatCard(this)"/></div>
            <div class="form-group"><label>Name on Card</label><input type="text" placeholder="Your Name" autocomplete="cc-name"/></div>
          </div>
          <div class="form-row">
            <div class="form-group"><label>CVV</label><input type="password" maxlength="3" placeholder="•••" autocomplete="cc-csc"/></div>
            <div class="form-group"><label>Expiry</label><input type="text" placeholder="MM/YYYY" oninput="formatExpiry(this)" autocomplete="cc-exp"/></div>
          </div>
        </div>

        <div class="method-fields" id="fields-upi">
          <div class="form-group"><label>UPI ID</label><input type="text" placeholder="yourname@upi" inputmode="email"/></div>
        </div>

        <div class="method-fields" id="fields-wallet">
          <div class="form-group">
            <label>Wallet Balance: ₹500</label>
            <p class="wallet-info">Your wallet balance will be debited for <strong id="payableAmount2">₹0</strong></p>
          </div>
        </div>

        <div class="payment-footer">
          <button class="btn-primary" onclick="validateAndPay()">Pay Now →</button>
        </div>
      </div>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="index.html"    class="bn-tab"><span class="bn-icon">🏠</span><span class="bn-label">Home</span></a>
    <a href="orders.html"   class="bn-tab"><span class="bn-icon">📦</span><span class="bn-label">Orders</span></a>
    <a href="wishlist.html" class="bn-tab"><span class="bn-icon">🤍</span><span class="bn-label">Wishlist</span></a>
    <a href="cart.html"     class="bn-tab"><span class="bn-icon">🛒</span><span class="bn-label">Cart</span></a>
    <a href="premium.html"  class="bn-tab" id="premTab"><span class="bn-icon">👑</span><span class="bn-label">Premium</span></a>
  </nav>

  <div id="toast"></div>
  <script src="data.js"></script>
  <script src="app.js"></script>
  <script>
    initPayment();

    // Method switcher
    document.querySelectorAll('.payment-method-option').forEach(opt => {
      opt.addEventListener('click', () => {
        document.querySelectorAll('.payment-method-option').forEach(o => o.classList.remove('active'));
        document.querySelectorAll('.method-fields').forEach(f => f.classList.remove('active'));
        opt.classList.add('active');
        document.getElementById('fields-' + opt.dataset.method)?.classList.add('active');
      });
    });

    function formatCard(el) {
      let v = el.value.replace(/\D/g, '').slice(0, 16);
      el.value = v.replace(/(\d{4})/g, '$1-').replace(/-$/, '');
    }
    function formatExpiry(el) {
      let v = el.value.replace(/\D/g, '').slice(0, 6);
      if (v.length >= 2) v = v.slice(0, 2) + '/' + v.slice(2);
      el.value = v;
    }
    function validateAndPay() {
      const method = document.querySelector('.payment-method-option.active')?.dataset.method;
      if (method === 'credit' || method === 'debit') {
        const af = document.getElementById(`fields-${method}`);
        const num = af?.querySelector('input[type="text"]')?.value?.replace(/-/g,'');
        const cvv = af?.querySelector('input[type="password"]')?.value;
        if (!num || num.length < 16) { showToast('Please enter a valid 16-digit card number'); return; }
        if (!cvv) { showToast('Please enter CVV'); return; }
      }
      if (method === 'upi') {
        const upi = document.getElementById('fields-upi')?.querySelector('input')?.value;
        if (!upi || !upi.includes('@')) { showToast('Please enter a valid UPI ID'); return; }
      }
      completePayment();
    }
  </script>
</body>
</html>
